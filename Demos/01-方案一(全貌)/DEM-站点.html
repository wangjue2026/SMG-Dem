<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DEM-分支 - 访问体验监控</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/css-overrides.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="../assets/js/ai-dem-data.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../assets/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="../assets/css/ai-dem.css" />

  <!-- 集中维护的双底座公共 Shell 样式 -->
  <link rel="stylesheet" href="./_shell/shell.css" />
</head>
<body class="bg-bg-light text-text font-sans overflow-hidden w-screen h-screen">

  <div id="dem-svgs"></div>

  <div class="flex flex-col w-full h-full" x-data="dualShellAppStore('体验预警')">
    <!-- 底座切换浮层（由 shell.js 注入） -->
    <div id="shell-switcher"></div>

    <!-- MODE 1: aTrust 线下底座框架 -->
    <div x-show="shell === 'atrust'" class="flex flex-col w-full h-full">
      <div id="shell-atrust-header"></div>
      <div class="flex-1 flex overflow-hidden">
        <div id="shell-atrust-sider"></div>
        <div class="flex-1 bg-bg-light flex flex-col overflow-hidden">
          <div class="flex-1 bg-[#F4F6F9] flex flex-col overflow-hidden" id="atrust-workspace"></div>
        </div>
      </div>
    </div>

    <!-- MODE 2: SASE 线上云底座框架 -->
    <div x-show="shell === 'sase'" class="flex w-full h-full overflow-hidden">
      <div id="shell-sase-sider"></div>
      <div class="flex-1 bg-bg-light flex flex-col overflow-hidden">
        <div class="flex-1 bg-[#F4F6F9] flex flex-col overflow-hidden" id="sase-workspace"></div>
      </div>
    </div>

    <!-- Workspace 内容模板 -->
    <template id="page-content-template">
      <div class="flex flex-col w-full h-full overflow-hidden">
        <!-- 体验监控 Tab 页头 -->
        <div class="h-[48px] min-h-[48px] bg-white border-b border-bg-line px-6 flex items-center justify-between flex-shrink-0 select-none z-20">
          <div class="flex items-center h-full">
            <span class="text-[14px] font-semibold text-text-title">体验监控</span>
            <div class="w-[1px] h-[16px] mx-[16px] bg-bg-line"></div>
            <div class="flex items-center h-full gap-6 relative">
              <template x-for="tab in ['首页', '分支', '用户', '应用']">
                <div class="relative h-full flex items-center cursor-pointer select-none group"
                     @click="pageTab = tab; navigateTo(tab)">
                  <span class="text-[14px] transition-colors"
                        :class="pageTab === tab ? 'text-brand font-semibold' : 'text-text-title font-normal group-hover:text-brand'"
                        x-text="tab"></span>
                  <div x-show="pageTab === tab" class="absolute bottom-0 left-0 right-0 h-[2px] bg-brand" x-cloak></div>
                </div>
              </template>
            </div>
          </div>
        </div>

        <main class="flex-1 bg-bg-light p-4 flex flex-col overflow-hidden">
          <div class="bg-white rounded-container border border-bg-line p-8 shadow-sm flex-1 flex flex-col items-center justify-center text-center">
            <div class="w-14 h-14 rounded-full bg-brand/10 text-brand flex items-center justify-center mb-4">
              <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
              </svg>
            </div>
            <h2 class="text-xl font-bold text-text-title">DEM-分支 模块容器</h2>
            <p class="text-xs text-text-mute mt-2 max-w-md leading-relaxed">路由关系与 Shell 框架已完整保留。您可以在此区域编写【分支】重构代码。</p>
          </div>
        </main>
      </div>
    </template>
  </div>

  <!-- 双底座公共 Shell 逻辑 -->
  <script src="./_shell/shell.js"></script>
  <script>
    (function injectSiteTemplate() {
      const tpl = document.getElementById('page-content-template');
      if (!tpl) return;
      ['atrust-workspace', 'sase-workspace'].forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.innerHTML = '';
          el.appendChild(tpl.content.cloneNode(true));
        }
      });
    })();
  </script>
</body>
</html>
