<!-- [PROJECT META] 方案类型：方案三 (丐版) | 路径：Demos/03-方案三（丐版）/DEM-告警排障.html -->
<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>【方案三-丐版】DEM - 体验预警 - 线上线下双底座</title>
 
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Alpine.js + Collapse 插件 -->
  <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <!-- 公共数据 & 公共样式 -->
  <script src="../assets/js/ai-dem-data.js"></script>
  <link rel="stylesheet" href="../assets/css/ai-dem.css" />

  <!-- 方案三公共底座样式 -->
  <link rel="stylesheet" href="./_shell/shell.css" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ["Inter", "PingFang SC", "sans-serif"], outfit: ["Outfit", "sans-serif"] },
          colors: {
            brand: { DEFAULT: "var(--color-blue, #1C6EFF)", hover: "var(--color-blue-l10, #387EFF)", active: "var(--color-blue-d10, #0056EB)" },
            text: { DEFAULT: "var(--color-graphite-d40, #272E38)", title: "var(--color-graphite-d30, #454C59)", mute: "var(--color-graphite, #A1A7B3)" },
            border: "var(--color-graphite-l20, #C0C8D6)",
            bg: { light: "var(--color-graphite-l50, #F4F6F9)", line: "var(--color-graphite-l30, #E1E5EB)" }
          }
        }
      }
    }
  </script>
</head>

<body class="bg-bg-light text-text font-sans overflow-hidden w-screen h-screen">

  <!-- 双底座根容器 — activePage 传入 '体验预警' 用于菜单高亮 -->
  <div class="flex flex-col w-full h-full" x-data="dualShellAppStore('体验预警')">

    <!-- 底座切换浮层（由 shell.js 注入） -->
    <div id="shell-switcher"></div>

    <!-- MODE 1: aTrust 线下底座框架 -->
    <div x-show="shell === 'atrust'" class="flex flex-col w-full h-full">
      <div id="shell-atrust-header"></div>
      <div class="flex-1 flex overflow-hidden">
        <div id="shell-atrust-sider"></div>
        <div class="flex-1 bg-bg-light flex flex-col overflow-hidden">
          <div class="flex-1 bg-[#F4F6F9] flex flex-col overflow-hidden" id="atrust-workspace"></div>
        </div>
      </div>
    </div>

    <!-- MODE 2: SASE 线上云底座框架 -->
    <div x-show="shell === 'sase'" class="flex w-full h-full overflow-hidden">
      <div id="shell-sase-sider"></div>
      <div class="flex-1 bg-bg-light flex flex-col overflow-hidden">
        <div class="flex-1 bg-[#F4F6F9] flex flex-col overflow-hidden" id="sase-workspace"></div>
      </div>
    </div>

    <!-- 体验预警 Workspace 模板（同时填充到 aTrust 和 SASE） -->
    <template id="page-content-template">
      <div class="flex flex-col w-full h-full overflow-hidden">

        <!-- 页头（单标题式） -->
        <div class="h-[48px] min-h-[48px] max-h-[48px] bg-white border-b border-[#E2E8F0] px-6 flex items-center flex-shrink-0 select-none z-20">
          <span class="text-[14px] font-semibold text-[#1E293B]">体验预警</span>
        </div>

        <!-- 主体滚动区 -->
        <div class="flex-1 px-4 py-2 flex flex-col gap-2.5 overflow-y-auto custom-scrollbar">

          <!-- 统计概览区 -->
          <div class="bg-white border border-[#E2E8F0] rounded-[4px] shadow-2xs flex-shrink-0">

            <!-- 工具栏行：报障定位按钮（左，自带 Popover 浮层） + 时间筛选 & 收起概览（右） -->
            <div class="px-3.5 py-2 flex items-center justify-between border-b border-[#E2E8F0]">

              <!-- 左侧：报障定位按钮 + Popover 浮层容器 -->
              <div class="relative">
                <!-- 按钮：蓝色描边、蓝色文字、白底无填充、准星探针图标 -->
                <button @click="showLocateModal = !showLocateModal"
                        class="h-7 px-3 bg-white border border-[#1C6EFF] text-[#1C6EFF] hover:bg-[#1C6EFF]/5 text-xs font-medium rounded-[2px] inline-flex items-center gap-1.5 cursor-pointer transition-colors select-none">
                  <svg class="w-3.5 h-3.5 text-[#1C6EFF]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="8" stroke-width="2"/>
                    <path stroke-linecap="round" stroke-width="2" d="M12 2v3m0 14v3M2 12h3m14 0h3"/>
                  </svg>
                  报障定位
                </button>

                <!-- Popover 下拉浮层（符合 comp-modal & comp-form 规范，拉宽至 480px） -->
                <div x-show="showLocateModal"
                     @click.outside="showLocateModal = false"
                     x-transition:enter="transition ease-out duration-150"
                     x-transition:enter-start="opacity-0 scale-95 -translate-y-1"
                     x-transition:enter-end="opacity-100 scale-100 translate-y-0"
                     x-transition:leave="transition ease-in duration-100"
                     x-transition:leave-start="opacity-100 scale-100 translate-y-0"
                     x-transition:leave-end="opacity-0 scale-95 -translate-y-1"
                     class="absolute top-full left-0 mt-1.5 w-[480px] bg-white rounded-[4px] border border-[#E2E8F0] shadow-xl z-50 select-none"
                     style="display: none;">

                  <!-- Form Header -->
                  <div class="px-4 py-2.5 bg-[#F8FAFC] border-b border-[#E2E8F0] flex items-center justify-between rounded-t-[4px]">
                    <div class="flex items-center gap-1.5">
                      <svg class="w-3.5 h-3.5 text-[#1C6EFF]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="8" stroke-width="2"/>
                        <path stroke-linecap="round" stroke-width="2" d="M12 2v3m0 14v3M2 12h3m14 0h3"/>
                      </svg>
                      <span class="text-xs font-semibold text-[#1E293B]">快速报障定位</span>
                    </div>
                    <button @click="showLocateModal = false" class="text-[#94A3B8] hover:text-[#475569] transition-colors p-0.5 cursor-pointer">
                      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                  </div>

                  <!-- Form Body (comp-form 风格) -->
                  <div class="p-4 space-y-3.5">
                    <!-- 时间范围 -->
                    <div>
                      <label class="block text-[11px] font-medium text-[#475569] mb-1">时间范围</label>
                      <div class="inline-flex items-center h-8 bg-white border border-[#D3D7DE] rounded-[2px] hover:border-[#1C6EFF] transition-colors text-xs w-full">
                        <!-- 前置下拉框：设定固定 84px 宽度，与下方的“查询对象”前置框等宽 -->
                        <div class="relative bg-[#F7F9FC] h-full px-2 flex items-center justify-between border-r border-[#D3D7DE] w-[84px] min-w-[84px] flex-shrink-0 cursor-pointer group rounded-l-[2px]">
                          <select x-model="locateDateShortcut" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full text-xs">
                            <option value="今天">今天</option>
                            <option value="近24小时">近24小时</option>
                            <option value="近3天">近3天</option>
                            <option value="近7天">近7天</option>
                            <option value="近30天">近30天</option>
                          </select>
                          <span class="text-[#2F3540] text-xs font-medium" x-text="locateDateShortcut"></span>
                          <svg class="w-3 h-3 text-[#A1A7B3] group-hover:text-[#1C6EFF] transition-colors flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </div>
                        <div class="h-full px-2.5 flex items-center flex-1 min-w-0">
                          <span class="font-mono text-xs text-[#2F3540] whitespace-nowrap" x-text="dateRange"></span>
                        </div>
                      </div>
                    </div>

                    <!-- 查询对象（前置下拉 + 联想输入组合框） -->
                    <div>
                      <label class="block text-[11px] font-medium text-[#475569] mb-1">查询对象</label>
                      <div class="relative">
                        <div class="flex items-stretch h-8 border border-[#D3D7DE] rounded-[2px] hover:border-[#1C6EFF] focus-within:border-[#1C6EFF] transition-colors bg-white">
                          <!-- 前置类型下拉框：设定固定 84px 宽度，与上方的“时间范围”前置框完全等宽 -->
                          <div class="relative flex items-center justify-between bg-[#F7F9FC] border-r border-[#D3D7DE] w-[84px] min-w-[84px] flex-shrink-0 px-2 cursor-pointer group rounded-l-[2px]">
                            <select x-model="locateQueryType"
                                    @change="locateQueryValue = ''; locateSuggestions = []; locateSuggestionVisible = false"
                                    class="absolute inset-0 opacity-0 cursor-pointer w-full h-full text-xs z-10">
                              <option value="用户">用户</option>
                              <option value="应用">应用</option>
                            </select>
                            <span class="text-xs font-medium text-[#2F3540] select-none" x-text="locateQueryType"></span>
                            <svg class="w-3 h-3 text-[#A1A7B3] group-hover:text-[#1C6EFF] transition-colors flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                          </div>
                          <!-- 联想输入框 -->
                          <input type="text" x-model="locateQueryValue"
                                 @input="onLocateInput()"
                                 @focus="onLocateInput()"
                                 @keydown.escape="locateSuggestionVisible = false"
                                 :placeholder="locateQueryType === '用户' ? '输入姓名 / 工号 / 邮箱...' : '输入应用名称...'"
                                 class="flex-1 h-full px-2.5 text-xs bg-transparent focus:outline-none text-[#2F3540] placeholder-[#A1A7B3] min-w-0" />
                          <template x-if="locateQueryValue">
                            <button @click="locateQueryValue = ''; locateSuggestions = []; locateSuggestionVisible = false"
                                    class="px-1.5 text-[#A1A7B3] hover:text-[#475569] transition-colors flex-shrink-0 cursor-pointer">
                              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                            </button>
                          </template>
                        </div>

                        <!-- 联想候选列表 -->
                        <div x-show="locateSuggestionVisible && locateSuggestions.length > 0"
                             class="absolute top-full left-0 right-0 mt-1 bg-white border border-[#E2E8F0] rounded-[3px] shadow-2xl z-[60] overflow-hidden max-h-52 overflow-y-auto">
                          <template x-for="(s, sIdx) in locateSuggestions" :key="s.value">
                            <div @click="selectLocateSuggestion(s)"
                                 class="px-2.5 py-1.5 flex items-center gap-2 hover:bg-[#F1F5F9] cursor-pointer transition-colors"
                                 :class="sIdx > 0 ? 'border-t border-[#F1F5F9]' : ''">
                              <div class="w-5 h-5 rounded-full flex-shrink-0 flex items-center justify-center text-white text-[10px]"
                                   :class="locateQueryType === '用户' ? 'bg-[#1C6EFF]' : 'bg-[#16A34A]'">
                                <span x-text="locateQueryType === '用户' ? '用' : '应'"></span>
                              </div>
                              <div class="min-w-0 flex-1">
                                <div class="text-xs font-medium text-[#1E293B] truncate" x-text="s.label"></div>
                                <div class="text-[10px] text-[#94A3B8] truncate" x-text="s.sub"></div>
                              </div>
                            </div>
                          </template>
                        </div>
                      </div>
                    </div>
                  </div>

                  <!-- Form Footer (左确定右取消，文案为“确定”) -->
                  <div class="px-4 py-2 bg-[#F8FAFC] border-t border-[#E2E8F0] flex items-center justify-end gap-2 rounded-b-[4px]">
                    <button @click="confirmLocate()"
                            :disabled="!locateQueryValue.trim()"
                            :class="!locateQueryValue.trim() ? 'bg-[#CBD5E1] text-[#94A3B8] cursor-not-allowed border-transparent' : 'bg-[#1C6EFF] hover:bg-[#387EFF] text-white cursor-pointer'"
                            class="h-8 px-4 text-xs font-medium rounded-[2px] transition-colors select-none">
                      确定
                    </button>
                    <button @click="showLocateModal = false"
                            class="h-8 px-4 text-xs text-[#475569] bg-white border border-[#D3D7DE] rounded-[2px] hover:border-[#1C6EFF] hover:text-[#1C6EFF] transition-colors cursor-pointer select-none">
                      取消
                    </button>
                  </div>
                </div>
              </div>

              <!-- 右侧：时间筛选 + 收起概览 -->
              <div class="flex items-center select-none gap-2">
                <div class="inline-flex items-center h-7 bg-white border border-[#D3D7DE] rounded-[2px] hover:border-[#1C6EFF] transition-colors text-xs">
                  <div class="relative bg-[#F7F9FC] h-full px-2 flex items-center justify-between border-r border-[#D3D7DE] min-w-[80px] cursor-pointer group">
                    <select x-model="dateShortcut" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full text-xs">
                      <option value="今天">今天</option>
                      <option value="近24小时">近24小时</option>
                      <option value="近3天">近3天</option>
                      <option value="近7天">近7天</option>
                      <option value="近30天">近30天</option>
                    </select>
                    <span class="text-[#2F3540] font-normal text-xs" x-text="dateShortcut || '今天'"></span>
                    <svg class="w-3.5 h-3.5 text-[#A1A7B3] ml-2 group-hover:text-[#1C6EFF] transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                  </div>
                  <div class="h-full pl-2.5 pr-2 flex items-center justify-between cursor-pointer whitespace-nowrap">
                    <span class="font-mono text-xs text-[#2F3540] whitespace-nowrap" x-text="dateRange"></span>
                    <svg class="w-3.5 h-3.5 text-[#A1A7B3] flex-shrink-0 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                  </div>
                </div>

                <button @click="showOverview = !showOverview"
                        class="h-7 px-2 bg-white border border-[#D3D7DE] rounded-[2px] hover:border-[#1C6EFF] hover:text-[#1C6EFF] transition-colors text-xs text-[#2F3540] inline-flex items-center gap-1 cursor-pointer select-none">
                  <span x-text="showOverview ? '收起概览' : '展开概览'"></span>
                  <svg class="w-3.5 h-3.5 text-[#A1A7B3] transition-transform duration-200" :class="!showOverview && 'rotate-180'" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path></svg>
                </button>
              </div>
            </div>

            <!-- 三大核心看板 -->
            <div x-show="showOverview" x-collapse class="p-3.5">
              <div class="grid grid-cols-1 md:grid-cols-3 divide-y md:divide-y-0 md:divide-x divide-[#E2E8F0]">

                <!-- 看板 1: 体验问题告警 -->
                <div class="pr-0 md:pr-4 py-2 md:py-0 flex flex-col justify-between">
                  <div class="flex items-center justify-between">
                    <span class="text-xs text-[#64748B] font-medium">体验问题告警</span>
                  </div>
                  <div class="mt-2">
                    <div class="flex items-baseline gap-1.5">
                      <span class="text-2xl font-bold text-[#CF171D] font-outfit" x-text="metrics.total"></span>
                      <span class="text-xs text-[#64748B]">起预警事件</span>
                    </div>
                    <div class="grid grid-cols-3 gap-2 mt-2">
                      <span class="h-6 inline-flex items-center justify-center rounded-[3px] text-[11px] font-normal bg-[#FFF5F5] text-[#E53E3E] border border-[#FED7D7] whitespace-nowrap px-1">高优先级 <span class="ml-1 font-semibold" x-text="metrics.highCount"></span></span>
                      <span class="h-6 inline-flex items-center justify-center rounded-[3px] text-[11px] font-normal bg-[#FFFAF0] text-[#DD6B20] border border-[#FEEBC8] whitespace-nowrap px-1">中优先级 <span class="ml-1 font-semibold" x-text="metrics.medCount"></span></span>
                      <span class="h-6 inline-flex items-center justify-center rounded-[3px] text-[11px] font-normal bg-[#F8FAFC] text-[#64748B] border border-[#E2E8F0] whitespace-nowrap px-1">低优先级 <span class="ml-1 font-semibold" x-text="metrics.lowCount"></span></span>
                    </div>
                  </div>
                </div>

                <!-- 看板 2: VIP对象访问体验 -->
                <div class="px-0 md:px-4 py-2 md:py-0 flex flex-col justify-between">
                  <div class="flex items-center justify-between">
                    <span class="text-xs text-[#64748B] font-medium">VIP对象访问体验</span>
                  </div>
                  <div class="mt-2">
                    <div class="grid grid-cols-2 gap-2">
                      <div class="bg-[#FFFDF5] border border-amber-100 p-2 rounded-[3px]">
                        <div class="text-[11px] text-[#78350F]">VIP用户体验受损</div>
                        <div class="mt-1 flex items-baseline gap-1">
                          <span class="text-xl font-bold text-[#D97706] font-outfit">3</span>
                          <span class="text-[11px] text-[#A1A7B3]">/ 50 名</span>
                        </div>
                      </div>
                      <div class="bg-[#FFFDF5] border border-amber-100 p-2 rounded-[3px]">
                        <div class="text-[11px] text-[#78350F]">VIP业务体验受损</div>
                        <div class="mt-1 flex items-baseline gap-1">
                          <span class="text-xl font-bold text-[#DC2626] font-outfit">2</span>
                          <span class="text-[11px] text-[#A1A7B3]">/ 8 个</span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <!-- 看板 3: 问题定位情况概览（依据列表数据动态计算占比与起数） -->
                <div class="pl-0 md:pl-4 py-2 md:py-0 flex flex-col justify-between">
                  <div class="flex items-center justify-between">
                    <span class="text-xs text-[#64748B] font-medium">问题定位情况概览</span>
                  </div>
                  <div class="mt-2">
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-1.5">

                      <div class="bg-[#F8FAFC] border border-[#E2E8F0] p-1.5 rounded-[3px] flex flex-col justify-between">
                        <div class="text-[10px] text-[#64748B] truncate">POP节点/连接器</div>
                        <div class="mt-1 flex items-baseline gap-0.5">
                          <span class="text-base font-bold text-[#1C6EFF] font-outfit" x-text="metrics.popPercent + '%'"></span>
                          <span class="text-[9px] text-[#A1A7B3] font-mono" x-text="'(' + metrics.popCount + '起)'"></span>
                        </div>
                        <div class="w-full h-1 bg-slate-200 rounded-full mt-1 overflow-hidden">
                          <div class="h-full bg-[#1C6EFF]" :style="'width: ' + metrics.popPercent + '%'"></div>
                        </div>
                      </div>

                      <div class="bg-[#F8FAFC] border border-[#E2E8F0] p-1.5 rounded-[3px] flex flex-col justify-between">
                        <div class="text-[10px] text-[#64748B] truncate">网络链路段</div>
                        <div class="mt-1 flex items-baseline gap-0.5">
                          <span class="text-base font-bold text-[#D97706] font-outfit" x-text="metrics.linkPercent + '%'"></span>
                          <span class="text-[9px] text-[#A1A7B3] font-mono" x-text="'(' + metrics.linkCount + '起)'"></span>
                        </div>
                        <div class="w-full h-1 bg-slate-200 rounded-full mt-1 overflow-hidden">
                          <div class="h-full bg-[#D97706]" :style="'width: ' + metrics.linkPercent + '%'"></div>
                        </div>
                      </div>

                      <div class="bg-[#F8FAFC] border border-[#E2E8F0] p-1.5 rounded-[3px] flex flex-col justify-between">
                        <div class="text-[10px] text-[#64748B] truncate">终端侧</div>
                        <div class="mt-1 flex items-baseline gap-0.5">
                          <span class="text-base font-bold text-[#9333EA] font-outfit" x-text="metrics.clientPercent + '%'"></span>
                          <span class="text-[9px] text-[#A1A7B3] font-mono" x-text="'(' + metrics.clientCount + '起)'"></span>
                        </div>
                        <div class="w-full h-1 bg-slate-200 rounded-full mt-1 overflow-hidden">
                          <div class="h-full bg-[#9333EA]" :style="'width: ' + metrics.clientPercent + '%'"></div>
                        </div>
                      </div>

                      <div class="bg-[#F8FAFC] border border-[#E2E8F0] p-1.5 rounded-[3px] flex flex-col justify-between">
                        <div class="text-[10px] text-[#64748B] truncate">应用服务端</div>
                        <div class="mt-1 flex items-baseline gap-0.5">
                          <span class="text-base font-bold text-[#16A34A] font-outfit" x-text="metrics.appPercent + '%'"></span>
                          <span class="text-[9px] text-[#A1A7B3] font-mono" x-text="'(' + metrics.appCount + '起)'"></span>
                        </div>
                        <div class="w-full h-1 bg-slate-200 rounded-full mt-1 overflow-hidden">
                          <div class="h-full bg-[#16A34A]" :style="'width: ' + metrics.appPercent + '%'"></div>
                        </div>
                      </div>

                    </div>
                  </div>
                </div>

              </div>
            </div>
          </div>

              { name: "南京 POP", sub: "NJ-POP01", status: "normal" },
              { name: "GW 连接器", sub: "NJ-GW-01", status: "normal" },
              { name: "Jira 系统", sub: "jira.corp.net", status: "normal" }
            ],
            links: [
              { label: "时延 10ms 丢包 0.0%", isError: false },
              { label: "时延 75ms 抖动", isError: true },
              { label: "时延 15ms 丢包 0.0%", isError: false }
            ]
          }
        ];
      }

      // 报障定位 Popover 联想候选 Mock 数据 (规范：用户展示用户名（显示名）+组织架构；应用展示应用名+地址信息)
      const USER_CANDIDATES = [
        { value: 'maria',      label: 'Maria (Maria)',      sub: 'DigiPlus马尼拉办公室 / 研发部',          dept: 'DigiPlus马尼拉办公室 / 出口 IP 203.177.12.8',      nameOnly: 'Maria' },
        { value: 'zhang_san',  label: '张三 (Zhang San)',  sub: '深信服科技 / 研发中心 / DEM产品部',      dept: '深信服科技 / 研发中心 / DEM产品部',      nameOnly: '张三' },
        { value: 'li_na',      label: '李娜 (Li Na)',      sub: '深信服科技 / 市场BG / 品牌推广部',        dept: '深信服科技 / 市场BG / 品牌推广部',        nameOnly: '李娜' },
        { value: 'wang_fang',  label: '王芳 (Wang Fang)',  sub: '深信服科技 / 财务中心 / 资金管理部',      dept: '深信服科技 / 财务中心 / 资金管理部',      nameOnly: '王芳' },
        { value: 'liu_qiang',  label: '刘强 (Liu Qiang)',  sub: '深信服科技 / 运维BG / 基础架构部',        dept: '深信服科技 / 运维BG / 基础架构部',        nameOnly: '刘强' },
        { value: 'chen_min',   label: '陈敏 (Chen Min)',   sub: '深信服科技 / 产品体验部 / UIUX设计组',    dept: '深信服科技 / 产品体验部 / UIUX设计组',    nameOnly: '陈敏' }
      ];
      const APP_CANDIDATES = [
        { value: 'feishu',     label: '飞书 SaaS 协同',   sub: 'https://feishu.cn (110.242.68.3:443)',       address: 'https://feishu.cn (110.242.68.3:443)',      nameOnly: '飞书' },
        { value: 'o365',       label: 'Office 365',      sub: 'https://office365.corp.com (52.96.0.1:443)', address: 'https://office365.corp.com (52.96.0.1:443)',nameOnly: 'Office 365' },
        { value: 'harbor',     label: 'Harbor 镜像仓库',  sub: 'https://harbor.corp.com (10.8.0.45:8443)',  address: 'https://harbor.corp.com (10.8.0.45:8443)',  nameOnly: 'Harbor 镜像仓库' },
        { value: 'salesforce', label: 'Salesforce CRM',   sub: 'https://salesforce.corp.com (172.16.20.10)', address: 'https://salesforce.corp.com (172.16.20.10)', nameOnly: 'Salesforce CRM' },
        { value: 'kingdee',    label: '金蝶云 ERP',       sub: 'https://kingdee.corp.com (10.12.3.88:8080)', address: 'https://kingdee.corp.com (10.12.3.88:8080)', nameOnly: '金蝶云 ERP' }
      ];

      return {
        // 底座切换
        shell: safeGet('demoShell_v2', 'atrust'),
        activePage: activePage || '告警排障',
        atrustExpandedL2: 'dem',
        saseExpandedL1Keys: ['dem-monitoring'],

        setShell(s) { this.shell = s; safeSet('demoShell_v2', s); },
        navigateTo(page) { const url = window.DEM_ROUTES_V2?.[page]; if (url) window.location.href = url; },
        toggleAtrustL2(key) { this.atrustExpandedL2 = this.atrustExpandedL2 === key ? '' : key; },
        toggleSaseL1(key) {
          this.saseExpandedL1Keys.includes(key)
            ? (this.saseExpandedL1Keys = this.saseExpandedL1Keys.filter(k => k !== key))
            : this.saseExpandedL1Keys.push(key);
        },
        isSaseExpanded(key) { return this.saseExpandedL1Keys.includes(key); },

        // 日期筛选与概览展开
        dateShortcut: '今天',
        dateRange: '2026-06-04 00:00:00 ~ 2026-06-04 23:59:59',
        showOverview: true,

        // 告警列表数据源
        alerts: [],

        // 筛选与分页
        searchQuery: '',
        selectedLevel: 'all',
        selectedDimension: 'all',
        currentPage: 1,
        pageSize: 10,

        // 报障定位 Popover 浮层状态
        showLocateModal: false,
        locateDateShortcut: '今天',
        locateQueryType: '用户',
        locateQueryValue: '',
        selectedLocateItem: null,
        locateSuggestions: [],
        locateSuggestionVisible: false,

        init() {
          this.alerts = generateSimplifiedAlerts();
        },

        // 跳转排障定位
        goTroubleshoot(title) {
          sessionStorage.setItem('dem_troubleshoot_title', title);
          window.location.href = window.DEM_ROUTES_V2['排障定位'];
        },

        // 报障定位 Popover 交互
        onLocateInput() {
          const q = this.locateQueryValue.trim().toLowerCase();
          const pool = this.locateQueryType === '用户' ? USER_CANDIDATES : APP_CANDIDATES;
          if (!q) {
            this.locateSuggestions = pool.slice(0, 6);
          } else {
            let filtered = pool.filter(s =>
              s.label.toLowerCase().includes(q) ||
              s.sub.toLowerCase().includes(q) ||
              (s.nameOnly && s.nameOnly.toLowerCase().includes(q))
            );
            // 保证搜索 Mock 数据不会出现为空现象
            if (filtered.length === 0) {
              filtered = pool;
            }
            this.locateSuggestions = filtered.slice(0, 6);
          }
          this.locateSuggestionVisible = true;
        },

        selectLocateSuggestion(s) {
          this.locateQueryValue = s.label;
          this.selectedLocateItem = s;
          this.locateSuggestions = [];
          this.locateSuggestionVisible = false;
        },

        confirmLocate() {
          const val = this.locateQueryValue.trim();
          if (!val) return;
          const pool = this.locateQueryType === '用户' ? USER_CANDIDATES : APP_CANDIDATES;
          let match = this.selectedLocateItem;
          if (!match || (match.label !== val && match.nameOnly !== val)) {
            match = pool.find(item =>
              item.label.toLowerCase().includes(val.toLowerCase()) ||
              val.toLowerCase().includes(item.nameOnly.toLowerCase())
            );
          }
          if (!match) {
            if (this.locateQueryType === '用户') {
              match = {
                value: 'custom_usr',
                label: `${val} (${val})`,
                nameOnly: val,
                sub: '深信服科技 / 研发中心 / DEM产品部',
                dept: '深信服科技 / 研发中心 / DEM产品部'
              };
            } else {
              match = {
                value: 'custom_app',
                label: val,
                nameOnly: val,
                sub: `https://${val.toLowerCase().replace(/\s+/g, '')}.corp.com (10.8.12.34:443)`,
                address: `https://${val.toLowerCase().replace(/\s+/g, '')}.corp.com (10.8.12.34:443)`
              };
            }
          }
          sessionStorage.setItem('dem_locate_query', JSON.stringify({
            dateShortcut: this.locateDateShortcut,
            timeRange: this.dateRange,
            queryType: this.locateQueryType,
            queryValue: val,
            selectedItem: match
          }));
          this.showLocateModal = false;
          window.location.href = window.DEM_ROUTES_V2['用户查询详情'] || './DEM-用户查询详情.html';
        },

        // 告警与概览计算属性
        get filteredAlerts() {
          const levelOrder = { '高优': 0, '中优': 1, '低优': 2 };
          return this.alerts.filter(a => {
            const query = this.searchQuery.trim().toLowerCase();
            const matchSearch = !query ||
              a.title.toLowerCase().includes(query) ||
              a.description.toLowerCase().includes(query) ||
              a.scope.appName.toLowerCase().includes(query);
            const matchLevel = this.selectedLevel === 'all' || a.level === this.selectedLevel;
            const matchDim = this.selectedDimension === 'all' || a.dimension === this.selectedDimension;
            return matchSearch && matchLevel && matchDim;
          }).sort((a, b) => {
            const lvDiff = (levelOrder[a.level] ?? 9) - (levelOrder[b.level] ?? 9);
            if (lvDiff !== 0) return lvDiff;
            return (b.time || '').localeCompare(a.time || '');
          });
        },

        get paginatedAlerts() {
          const start = (this.currentPage - 1) * this.pageSize;
          return this.filteredAlerts.slice(start, start + this.pageSize);
        },

        get totalPages() {
          return Math.ceil(this.filteredAlerts.length / this.pageSize) || 1;
        },

        // 右上角看版指标的【动态计算】逻辑
        get metrics() {
          const currentList = this.filteredAlerts;
          const total = currentList.length;
          const highCount = currentList.filter(a => a.level === '高优').length;
          const medCount = currentList.filter(a => a.level === '中优').length;
          const lowCount = currentList.filter(a => a.level === '低优').length;

          // 依据列表数据中的 locationCategory 实时统计起数与占比
          const popCount = currentList.filter(a => a.locationCategory === 'POP节点/连接器').length;
          const linkCount = currentList.filter(a => a.locationCategory === '网络链路段').length;
          const clientCount = currentList.filter(a => a.locationCategory === '终端侧').length;
          const appCount = currentList.filter(a => a.locationCategory === '应用服务端').length;

          const popPercent = total > 0 ? Math.round((popCount / total) * 100) : 0;
          const linkPercent = total > 0 ? Math.round((linkCount / total) * 100) : 0;
          const clientPercent = total > 0 ? Math.round((clientCount / total) * 100) : 0;
          const appPercent = total > 0 ? Math.round((appCount / total) * 100) : 0;

          return {
            total, highCount, medCount, lowCount,
            popCount, popPercent,
            linkCount, linkPercent,
            clientCount, clientPercent,
            appCount, appPercent
          };
        },

        getLevelBadgeClass(lvl) {
          if (lvl === '高优') return 'bg-[#CF171D]/10 text-[#CF171D] rounded-[2px] font-normal border-0 w-[36px] h-5 inline-flex items-center justify-center text-xs';
          if (lvl === '中优') return 'bg-[#FA721B]/10 text-[#FA721B] rounded-[2px] font-normal border-0 w-[36px] h-5 inline-flex items-center justify-center text-xs';
          return 'bg-[#6F7785]/10 text-[#2F3540] rounded-[2px] font-normal border-0 w-[36px] h-5 inline-flex items-center justify-center text-xs';
        },

        changePage(p) {
          if (p < 1 || p > this.totalPages) return;
          this.currentPage = p;
        }
      };
    };
  </script>

</body>
</html>
