                <!-- VIP 对象管理 -->
                <div class="flex items-center gap-3 p-2.5 bg-[#F8FAFC] rounded border border-dashed border-[#CBD5E1]">

                  </div>
                  <div>
                    <div class="text-xs font-semibold text-[#1E293B]">告警通知渠道</div>
                    <div class="text-[11px] text-[#64748B]">配置飞书、企业微信、邮件等告警推送渠道与接收组</div>
                  </div>
                  <span class="ml-auto text-[10px] text-[#A1A7B3] border border-[#E2E8F0] rounded px-1.5 py-0.5 flex-shrink-0">待设计</span>
                </div>
              </div>
            </div>

            <!-- 导航按钮 -->
            <div class="flex items-center justify-center gap-3">
              <button @click="navigateTo('体验预警')" class="px-4 py-2 bg-[#1C6EFF] hover:bg-[#0056EB] text-white rounded-[3px] text-sm font-medium transition-colors cursor-pointer flex items-center gap-2">

              <button @click="navigateTo('排障定位')" class="px-4 py-2 bg-white hover:bg-[#F8FAFC] border border-[#D3D7DE] hover:border-[#1C6EFF] text-[#334155] rounded-[3px] text-sm font-medium transition-colors cursor-pointer">
                前往排障定位
              </button>
            </div>
          </div>
        </div>

      </div>
    </template>
  </div>

  <!-- 方案二公共底座脚本 -->
  <script src="./_shell/shell.js"></script>

  <script>
    (function injectConfigTemplate() {
      const tpl = document.getElementById('page-content-template');
      if (!tpl) return;
      ['atrust-workspace', 'sase-workspace'].forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.innerHTML = '';
          el.appendChild(tpl.content.cloneNode(true));
        }
      });
    })();

    // 此页面无额外 store 扩展，使用公共 dualShellAppStore 即可
  </script>
