                    class="relative bg-[#FAFAFA] hover:bg-[#F1F5F9] h-full px-2.5 flex items-center justify-between border-r border-[#D9D9D9] min-w-[84px] cursor-pointer transition-colors"
                    @click="toggleShortcutDropdown()">
                    <span class="text-[#262626] font-normal text-xs" x-text="dateFilterState.shortcut"></span>
                    <svg class="w-3.5 h-3.5 text-[#BFBFBF] ml-2 transition-transform duration-200"
                      :class="dateFilterState.shortcutDropdownOpen && 'rotate-180'" fill="none" stroke="currentColor"
                      viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                  </div>

                  <!-- 2. 右侧日期范围展示区 (点击直接唤出面板) -->
                  <div
                    class="h-full pl-3 pr-2.5 flex items-center justify-between cursor-pointer whitespace-nowrap hover:bg-[#FAFAFA] transition-colors"
                    @click="openDatePickerDirectly()">
                    <span class="font-mono text-xs text-[#595959] whitespace-nowrap"
                      x-text="dateFilterState.rangeText"></span>
                    <svg class="w-3.5 h-3.5 text-[#BFBFBF] flex-shrink-0 ml-2.5" fill="none" stroke="currentColor"
                      viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z">
                      </path>
                    </svg>
                  </div>
                </div>

                <!-- 快捷下拉菜单 -->
                <div x-show="dateFilterState.shortcutDropdownOpen" x-transition:enter="transition ease-out duration-100"
                  x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
                  x-transition:leave="transition ease-in duration-75" x-transition:leave-start="opacity-100 scale-100"
                  x-transition:leave-end="opacity-0 scale-95"
                  class="absolute top-9 left-0 z-50 bg-white border border-[#E2E8F0] rounded-[2px] shadow-lg py-1 min-w-[110px] text-xs"
                  style="display: none;">
                  <template x-for="item in ['今天', '近24小时', '近3天', '近7天', '近30天']" :key="item">
                    <div @click="selectShortcut(item)" @mouseenter="dateFilterState.hoverCustom = false"
                      class="px-3 py-1.5 cursor-pointer flex items-center justify-between transition-colors"
                      :class="dateFilterState.shortcut === item ? 'bg-[#E6F4FF] text-[#1C6EFF] font-medium' : 'text-[#262626] hover:bg-[#FAFAFA]'">
                      <span x-text="item"></span>
                      <svg x-show="dateFilterState.shortcut === item" class="w-3.5 h-3.5 text-[#1C6EFF]" fill="none"
                        stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                      </svg>
                    </div>
                  </template>

                  <!-- 自定义项：hover 时在右侧级联展开日历面板 -->
                  <div @mouseenter="dateFilterState.hoverCustom = true; initPickerTempDates()"
                    @click="dateFilterState.hoverCustom = true; initPickerTempDates()"
                    class="relative px-3 py-1.5 cursor-pointer flex items-center justify-between transition-colors border-t border-[#F1F5F9] mt-0.5"
                    :class="(dateFilterState.shortcut === '自定义' || dateFilterState.hoverCustom) ? 'bg-[#E6F4FF] text-[#1C6EFF] font-medium' : 'text-[#262626] hover:bg-[#FAFAFA]'">
                    <span>自定义</span>
                    <svg class="w-3 h-3 text-[#8C8C8C]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                  </div>
                </div>

                <!-- 日期时间范围选择面板 -->
                <div
                  x-show="dateFilterState.pickerOpen || (dateFilterState.shortcutDropdownOpen && dateFilterState.hoverCustom)"
                  x-transition:enter="transition ease-out duration-150"
                  x-transition:enter-start="opacity-0 translate-y-1" x-transition:enter-end="opacity-100 translate-y-0"
                  x-transition:leave="transition ease-in duration-100"
                  x-transition:leave-start="opacity-100 translate-y-0" x-transition:leave-end="opacity-0 translate-y-1"
                  class="absolute top-9 right-0 z-50 bg-white border border-[#E2E8F0] rounded-[3px] shadow-xl p-3 text-xs w-[320px]"
                  style="display: none;">

                  <div class="flex items-center justify-between pb-2 mb-2 border-b border-[#F1F5F9]">
                    <button type="button" @click.stop="prevMonth()"
                      class="p-1 hover:bg-[#F1F5F9] rounded text-[#64748B] hover:text-[#1C6EFF] transition-colors">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7">
                        </path>
                      </svg>
                    </button>
                    <span class="font-medium text-[#1E293B]"
                      x-text="`${dateFilterState.currentYear}年 ${dateFilterState.currentMonth + 1}月`"></span>
                    <button type="button" @click.stop="nextMonth()"
                      class="p-1 hover:bg-[#F1F5F9] rounded text-[#64748B] hover:text-[#1C6EFF] transition-colors">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                      </svg>
                    </button>
                  </div>

                  <div class="grid grid-cols-7 gap-1 text-center text-[11px] text-[#94A3B8] mb-1 font-medium">
                    <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
                  </div>

                  <div class="grid grid-cols-7 gap-y-1 text-center text-xs">
                    <template x-for="d in getCalendarDays(dateFilterState.currentYear, dateFilterState.currentMonth)"
                      :key="d.dateStr">
                      <div class="h-7 flex items-center justify-center relative cursor-pointer group" :class="{
                           'opacity-30 cursor-not-allowed pointer-events-none': isDateDisabled(d.dateStr),
                           'text-[#CBD5E1]': !d.isCurrentMonth,
                           'text-[#1E293B]': d.isCurrentMonth && !isDateStartOrEnd(d.dateStr),
                           'bg-[#E6F4FF]': isDateInRange(d.dateStr) && !isDateStartOrEnd(d.dateStr)
                         }" @click.stop="handleDateClick(d.dateStr)" @mouseenter="handleDateHover(d.dateStr)">
                        <span
                          class="w-6 h-6 flex items-center justify-center rounded-full text-xs font-medium transition-colors z-10"
                          :class="isDateStartOrEnd(d.dateStr) ? 'bg-[#1C6EFF] text-white font-bold shadow-xs' : 'group-hover:bg-[#F1F5F9]'"
                          x-text="d.day"></span>
                      </div>
                    </template>
                  </div>

                  <div class="mt-3 pt-2.5 border-t border-[#F1F5F9] space-y-2.5">
                    <div class="flex items-center justify-between text-[11px] text-[#5C6270]">
                      <span class="text-[#64748B] font-medium">时间范围:</span>
                      <div class="flex items-center gap-1.5 font-mono">
                        <input type="text" x-model="dateFilterState.startTime" placeholder="00:00:00" maxlength="8"
                          @click.stop
                          class="w-[68px] h-[22px] px-1 text-center font-mono text-[11px] border border-[#D3D7DE] rounded-[2px] focus:border-[#1C6EFF] focus:outline-none text-[#1E293B] bg-[#F8FAFC] focus:bg-white transition-colors" />
                        <span class="text-[#94A3B8]">-</span>
                        <input type="text" x-model="dateFilterState.endTime" placeholder="23:59:59" maxlength="8"
                          @click.stop
                          class="w-[68px] h-[22px] px-1 text-center font-mono text-[11px] border border-[#D3D7DE] rounded-[2px] focus:border-[#1C6EFF] focus:outline-none text-[#1E293B] bg-[#F8FAFC] focus:bg-white transition-colors" />
                      </div>
                    </div>

                    <div class="flex items-center justify-between text-[11px]">
                      <span class="text-[#94A3B8]">最大跨度 30 天</span>
                      <div class="flex items-center gap-1.5">
                        <button type="button" @click.stop="closeAllDatePopups()"
                          class="px-2 py-1 bg-[#F1F5F9] hover:bg-[#E2E8F0] text-[#64748B] rounded-[2px] transition-colors cursor-pointer">取消</button>
                        <button type="button" @click.stop="applyCustomDateRange()"
                          class="px-2.5 py-1 bg-[#1C6EFF] hover:bg-[#0E42D2] text-white rounded-[2px] font-medium shadow-xs transition-colors cursor-pointer">确定</button>
                      </div>
                    </div>
                  </div>

                </div>
              </div>

              <!-- 刷新按钮 -->
              <button @click="refreshData()"
                class="w-8 h-8 bg-white border border-[#D9D9D9] hover:border-[#1C6EFF] hover:text-[#1C6EFF] rounded-[2px] flex items-center justify-center text-[#4E5969] transition-colors shadow-2xs cursor-pointer group"
                title="刷新数据">
                <svg :class="isRefreshing ? 'animate-spin text-[#1C6EFF]' : 'group-hover:text-[#1C6EFF]'"
                  class="w-3.5 h-3.5 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                  </path>
                </svg>
              </button>
            </div>
          </div>

          <!-- 2.2 概览统计卡片区 (左右卡片合并为单一整体，最小高度增加16px达到132px，下边距 8px: mb-2) -->
          <div
            class="bg-white rounded-[2px] border border-[#E5E6EB] p-3 shadow-2xs mb-2 flex-shrink-0 min-h-[132px] flex flex-col lg:flex-row items-stretch">

            <!-- 左半边：告警概况与每日告警趋势 (纯留白过渡无分割线) -->
            <div class="w-full lg:w-1/2 flex items-stretch justify-between pr-0 lg:pr-6 pb-3 lg:pb-2">
              <!-- 告警总数指标 (整体向右平移4px: pl-1) -->
              <div class="w-[185px] flex-shrink-0 flex flex-col justify-between h-full pl-1 pr-2">
                <span class="text-[12px] font-medium text-[#1D2129]">告警总数</span>

                <!-- 统计信息 (向上移动2px，向右移动4px) -->
                <div class="flex items-center gap-3 mt-auto pt-1 translate-x-[4px] -translate-y-[2px]">
                  <!-- 统计数字（该数值为所选时间范围内的累计告警数） -->
                  <div class="flex flex-col">
                    <span class="text-[32px] font-bold text-[#1C6EFF] tracking-tight leading-none font-sans"
                      x-text="totalAlarmCount">27</span>
                  </div>

                  <!-- 统计数字右侧：四个告警等级统计 (紧急/重要/次要/提示，2×2 排布) -->
                  <div class="grid grid-cols-2 gap-x-3 gap-y-1.5 text-[12px] translate-x-[8px]">
                    <div class="flex items-baseline gap-1.5 whitespace-nowrap">
                      <span class="text-[#86909C]">紧急</span>
                      <span class="font-semibold text-[#1D2129]" x-text="urgentCount">9</span>
                    </div>
                    <div class="flex items-baseline gap-1.5 whitespace-nowrap">
                      <span class="text-[#86909C]">重要</span>
                      <span class="font-semibold text-[#1D2129]" x-text="importantCount">11</span>
                    </div>
                    <div class="flex items-baseline gap-1.5 whitespace-nowrap">
                      <span class="text-[#86909C]">次要</span>
                      <span class="font-semibold text-[#1D2129]" x-text="secondaryCount">4</span>
                    </div>
                    <div class="flex items-baseline gap-1.5 whitespace-nowrap">
                      <span class="text-[#86909C]">提示</span>
                      <span class="font-semibold text-[#1D2129]" x-text="infoCount">3</span>
                    </div>
                  </div>
                </div>
              </div>

              <!-- 告警趋势分析区 (宽度缩短16px：pr-6且min-w-[324px]，右侧呼吸感更舒展) -->
              <div class="flex-1 min-w-[324px] flex flex-col justify-between h-full pl-2 pr-6 relative select-none">
                <!-- 顶部标题与区间统计指标 (数值黑色不加粗，绝对不换行) -->
                <div class="flex items-center justify-between text-[12px]">
                  <div class="flex items-center gap-1.5">
                    <span class="font-normal text-[#86909C]">告警趋势</span>
                    <span class="text-[10px] text-[#A9AEB8]" x-text="'· ' + trendBucketLabel">· 按天</span>
                  </div>
                  <div class="flex items-center gap-2 text-[11px] text-[#86909C] whitespace-nowrap flex-shrink-0">
                    <span>峰值 <span class="font-normal text-[#1D2129]" x-text="trendPeak + '次'">27次</span></span>
                    <span class="text-[#D3D7DE]">·</span>
                    <span><span x-text="trendAvgLabel">日均</span> <span class="font-normal text-[#1D2129]"
                        x-text="trendAvg + '次'">8次</span></span>
                  </div>
                </div>

                <!-- 趋势图主绘图区 (SVG 矢量折线 + 顶层 HTML 高灵敏交互触发层) -->
                <div class="relative w-full h-[64px] mt-1 flex flex-col justify-end"
                  @mouseleave="trendHoverIndex = null">

                  <!-- 交互 Tooltip 悬浮信息框 (精准查看每日紧急与重要告警各多少) -->
                  <div x-show="trendHoverIndex !== null && trendChartPoints[trendHoverIndex]"
                    class="absolute z-30 pointer-events-none -top-1 bg-[#1D2129]/95 text-white text-[11px] py-1.5 px-3 rounded-[3px] shadow-lg whitespace-nowrap transform -translate-x-1/2 -translate-y-full transition-all duration-75"
                    :style="`left: ${trendHoverIndex !== null ? ((trendHoverIndex + 0.5) / trendChartPoints.length) * 100 : 50}%`">
                    <div
                      class="flex items-center justify-between gap-3 text-[10px] text-white/80 pb-1 border-b border-white/10">
                      <span class="font-medium text-white" x-text="trendChartPoints[trendHoverIndex]?.date"></span>
                      <span class="text-white/60"
                        x-text="'共 ' + (trendChartPoints[trendHoverIndex]?.total || 0) + ' 条告警'"></span>
                    </div>
                    <div class="grid grid-cols-2 gap-x-3 gap-y-1 mt-1 text-[11px]">
                      <span class="flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-[#F53F3F]"></span>
                        <span class="text-white/80">紧急:</span>
                        <strong class="font-medium text-white"
                          x-text="(trendChartPoints[trendHoverIndex]?.urgent || 0) + ' 条'"></strong>
                      </span>
                      <span class="flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-[#FF7D00]"></span>
                        <span class="text-white/80">重要:</span>
                        <strong class="font-medium text-white"
                          x-text="(trendChartPoints[trendHoverIndex]?.important || 0) + ' 条'"></strong>
                      </span>
                      <span class="flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-[#D48806]"></span>
                        <span class="text-white/80">次要:</span>
                        <strong class="font-medium text-white"
                          x-text="(trendChartPoints[trendHoverIndex]?.secondary || 0) + ' 条'"></strong>
                      </span>
                      <span class="flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-[#86909C]"></span>
                        <span class="text-white/80">提示:</span>
                        <strong class="font-medium text-white"
                          x-text="(trendChartPoints[trendHoverIndex]?.info || 0) + ' 条'"></strong>
                      </span>
                    </div>
                    <!-- 小三角箭头 -->
                    <div
                      class="absolute left-1/2 -bottom-1 -translate-x-1/2 border-solid border-t-[#1D2129]/95 border-t-4 border-x-transparent border-x-4 border-b-0">
                    </div>
                  </div>

                  <!-- 核心 SVG 渲染层 (折线、小圆点、悬浮高亮圆点均在同一矢量坐标系内，100% 绝对严丝合缝咬合在曲线上) -->
                  <svg class="w-full h-[46px] overflow-visible pointer-events-none" viewBox="0 0 350 48"
                    preserveAspectRatio="none">
                    <defs>
                      <linearGradient id="demAlarmAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#1C6EFF" stop-opacity="0.22" />
                        <stop offset="100%" stop-color="#1C6EFF" stop-opacity="0.01" />
                      </linearGradient>
                    </defs>

                    <!-- 背景参考刻度虚线 -->
                    <line x1="0" y1="8" x2="350" y2="8" stroke="#F0F2F5" stroke-dasharray="2 2" stroke-width="1" />
                    <line x1="0" y1="26" x2="350" y2="26" stroke="#F0F2F5" stroke-dasharray="2 2" stroke-width="1" />
                    <line x1="0" y1="46" x2="350" y2="46" stroke="#E5E6EB" stroke-width="1" />

                    <!-- 面积填充路径 -->
                    <path :d="trendAreaPath" fill="url(#demAlarmAreaGrad)" />

                    <!-- 折线路径 -->
                    <path :d="trendLinePath" fill="none" stroke="#1C6EFF" stroke-width="2" stroke-linecap="round"
                      stroke-linejoin="round" />

                    <!-- 折线数据节点小圆点 (在 SVG 内部绘制，绝对严格咬合在折线上，分毫不差) -->
                    <g>
                      <circle x-show="trendChartPoints[0]" :cx="trendChartPoints[0]?.x" :cy="trendChartPoints[0]?.y"
                        r="2.5" fill="#FFFFFF" stroke="#1C6EFF" stroke-width="1.5" />
                      <circle x-show="trendChartPoints[1]" :cx="trendChartPoints[1]?.x" :cy="trendChartPoints[1]?.y"
                        r="2.5" fill="#FFFFFF" stroke="#1C6EFF" stroke-width="1.5" />
                      <circle x-show="trendChartPoints[2]" :cx="trendChartPoints[2]?.x" :cy="trendChartPoints[2]?.y"
                        r="2.5" fill="#FFFFFF" stroke="#1C6EFF" stroke-width="1.5" />
                      <circle x-show="trendChartPoints[3]" :cx="trendChartPoints[3]?.x" :cy="trendChartPoints[3]?.y"
                        r="2.5" fill="#FFFFFF" stroke="#1C6EFF" stroke-width="1.5" />
                      <circle x-show="trendChartPoints[4]" :cx="trendChartPoints[4]?.x" :cy="trendChartPoints[4]?.y"
                        r="2.5" fill="#FFFFFF" stroke="#1C6EFF" stroke-width="1.5" />
                      <circle x-show="trendChartPoints[5]" :cx="trendChartPoints[5]?.x" :cy="trendChartPoints[5]?.y"
                        r="2.5" fill="#FFFFFF" stroke="#1C6EFF" stroke-width="1.5" />
                      <circle x-show="trendChartPoints[6]" :cx="trendChartPoints[6]?.x" :cy="trendChartPoints[6]?.y"
                        r="2.5" fill="#FFFFFF" stroke="#1C6EFF" stroke-width="1.5" />
                    </g>

                    <!-- 悬停节点指示虚线与高亮大圆点 (在当前 hover 节点上 100% 严丝合缝贴合) -->
                    <g x-show="trendHoverIndex !== null && trendChartPoints[trendHoverIndex]">
                      <line :x1="trendChartPoints[trendHoverIndex]?.x" y1="4" :x2="trendChartPoints[trendHoverIndex]?.x"
                        y2="46" stroke="#1C6EFF" stroke-width="1" stroke-dasharray="2 2" stroke-opacity="0.6" />
                      <circle :cx="trendChartPoints[trendHoverIndex]?.x" :cy="trendChartPoints[trendHoverIndex]?.y"
                        r="4.5" fill="#1C6EFF" stroke="#FFFFFF" stroke-width="2" />
                    </g>
                  </svg>

                  <!-- 顶层纯透明 HTML 交互触发层 (不承担视觉渲染，整列透明捕获鼠标事件) -->
                  <div class="absolute top-0 left-0 right-0 h-[46px] flex items-stretch z-10">
                    <template x-for="(pt, idx) in trendChartPoints" :key="idx">
                      <div class="flex-1 h-full cursor-pointer" @mouseenter="trendHoverIndex = idx"
                        @mousemove="trendHoverIndex = idx">
                      </div>
                    </template>
                  </div>

                  <!-- 底部 X 轴刻度 (min-w-0 让每格严格等分为 1/n 宽度；首尾贴边对齐防止溢出；点数多时按步长抽稀) -->
                  <div class="flex items-center text-[10px] text-[#86909C] mt-1 font-mono leading-none">
                    <template x-for="(pt, idx) in trendChartPoints" :key="idx">
                      <span class="flex-1 min-w-0 whitespace-nowrap transition-colors"
                        :class="[(trendLabelEdgeClamp && idx === 0) ? 'text-left' : ((trendLabelEdgeClamp && idx === trendChartPoints.length - 1) ? 'text-right' : 'text-center'), trendHoverIndex === idx ? 'text-[#1C6EFF] font-semibold' : '']"
                        x-text="(idx % trendLabelStep === 0 || idx === trendChartPoints.length - 1) ? pt.date : ''"></span>
                    </template>
                  </div>

                </div>
              </div>
            </div>

            <!-- 右半边：告警对象分布 (黑色标题) -->
            <div class="w-full lg:w-1/2 pl-0 lg:pl-4 pt-3 lg:pt-0 flex flex-col justify-between h-full">
              <div class="flex items-center justify-between">
                <span class="text-[12px] font-medium text-[#1D2129]">告警对象分布</span>
              </div>

              <!-- 3个精炼子卡片并排 -->
              <div class="grid grid-cols-3 gap-2.5 mt-2 flex-1 items-stretch">

                <!-- 用户告警 -->
                <div @click="filterByType('用户')"
                  :class="filterAlarmType === '用户' ? 'bg-[#F0F5FF] border-[#1C6EFF] ring-1 ring-[#1C6EFF]' : 'bg-[#FAFAFA] hover:bg-[#F2F3F5] border-[#E5E6EB]'"
                  class="border rounded-[2px] p-2.5 flex flex-col justify-between cursor-pointer transition-all border-t-2 border-t-[#1C6EFF] group">
                  <div class="flex items-center justify-between text-[11px] text-[#4E5969]">
                    <span
                      :class="filterAlarmType === '用户' ? 'text-[#1C6EFF] font-medium' : 'group-hover:text-[#1C6EFF]'"
                      class="transition-colors">用户访问体验差</span>
                    <svg class="w-3.5 h-3.5 text-[#1C6EFF]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                  </div>
                  <div class="flex items-baseline justify-between mt-2">
                    <span class="text-[22px] font-bold text-[#1D2129] leading-none font-sans"
                      x-text="userAlarmCount">6</span>
                    <span class="text-[10px] text-[#86909C]" x-text="'占比 ' + userRatio + '%'">占比 22%</span>
                  </div>
                </div>

                <!-- 应用告警 -->
                <div @click="filterByType('应用')"
                  :class="filterAlarmType === '应用' ? 'bg-[#F0FFF4] border-[#00B42A] ring-1 ring-[#00B42A]' : 'bg-[#FAFAFA] hover:bg-[#F2F3F5] border-[#E5E6EB]'"
                  class="border rounded-[2px] p-2.5 flex flex-col justify-between cursor-pointer transition-all border-t-2 border-t-[#00B42A] group">
                  <div class="flex items-center justify-between text-[11px] text-[#4E5969]">
                    <span
                      :class="filterAlarmType === '应用' ? 'text-[#00B42A] font-medium' : 'group-hover:text-[#00B42A]'"
                      class="transition-colors">应用访问体验差</span>
                    <svg class="w-3.5 h-3.5 text-[#00B42A]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
                    </svg>
                  </div>
                  <div class="flex items-baseline justify-between mt-2">
                    <span class="text-[22px] font-bold text-[#1D2129] leading-none font-sans"
                      x-text="appAlarmCount">11</span>
                    <span class="text-[10px] text-[#86909C]" x-text="'占比 ' + appRatio + '%'">占比 41%</span>
                  </div>
                </div>

                <!-- 分支告警 -->
                <div @click="filterByType('分支')"
                  :class="filterAlarmType === '分支' ? 'bg-[#F9F0FF] border-[#722ED1] ring-1 ring-[#722ED1]' : 'bg-[#FAFAFA] hover:bg-[#F2F3F5] border-[#E5E6EB]'"
                  class="border rounded-[2px] p-2.5 flex flex-col justify-between cursor-pointer transition-all border-t-2 border-t-[#722ED1] group">
                  <div class="flex items-center justify-between text-[11px] text-[#4E5969]">
                    <span
                      :class="filterAlarmType === '分支' ? 'text-[#722ED1] font-medium' : 'group-hover:text-[#722ED1]'"
                      class="transition-colors">分支访问体验差</span>
                    <svg class="w-3.5 h-3.5 text-[#722ED1]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4">
                      </path>
                    </svg>
                  </div>
                  <div class="flex items-baseline justify-between mt-2">
                    <span class="text-[22px] font-bold text-[#1D2129] leading-none font-sans"
                      x-text="branchAlarmCount">10</span>
                    <span class="text-[10px] text-[#86909C]" x-text="'占比 ' + branchRatio + '%'">占比 37%</span>
                  </div>
                </div>

              </div>
            </div>
          </div>

          <!-- 2.3 表格与筛选卡片区 (严格遵循 @comp-table 规范，自适应充满剩余空间，去除死定高) -->
          <div
            class="bg-white rounded-[2px] border border-[#E5E6EB] shadow-2xs flex-1 min-h-0 flex flex-col overflow-hidden">

            <!-- 顶部操作与筛选栏 (边距优化为 px-4 py-2.5) -->
            <div
              class="px-4 py-2.5 border-b border-[#F2F3F5] flex items-center justify-between gap-3 flex-wrap select-none">
              <!-- 左侧：批量修改告警状态按钮 (@comp-button 规范) -->
              <div class="relative">
                <button type="button" @click="if (selectedIds.length) batchModalOpen = !batchModalOpen"
                  :disabled="!selectedIds.length"
                  :class="selectedIds.length ? 'bg-[#1C6EFF] text-white hover:opacity-85 cursor-pointer' : 'bg-[#F5F5F5] text-[#A1A7B3] border border-[#D9D9D9] cursor-not-allowed'"
                  class="h-8 px-4 rounded-[2px] text-[12px] font-normal transition-all flex items-center gap-1.5 shadow-none">
                  <span>批量修改告警状态</span>
                  <span x-show="selectedIds.length" class="text-[11px] bg-white/20 px-1 rounded"
                    x-text="'(' + selectedIds.length + ')'"></span>
                </button>

                <!-- 批量修改状态微型气泡下拉 -->
                <div x-show="batchModalOpen" @click.away="batchModalOpen = false"
                  class="absolute left-0 top-full mt-1.5 w-40 bg-white border border-[#E5E6EB] rounded-[3px] shadow-lg py-1.5 z-40 text-[12px]"
                  style="display: none;">
                  <div class="px-3 py-1 text-[11px] text-[#86909C] border-b border-[#F2F3F5]">标记选中项为：</div>
                  <div @click="batchUpdateStatus('待处理')"
                    class="px-3 py-1.5 hover:bg-[#F2F3F5] text-[#F53F3F] cursor-pointer flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-[#F53F3F]"></span>
                    <span>待处理</span>
                  </div>
                  <div @click="batchUpdateStatus('已恢复')"
                    class="px-3 py-1.5 hover:bg-[#F2F3F5] text-[#00B42A] cursor-pointer flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-[#00B42A]"></span>
                    <span>已恢复</span>
                  </div>
                  <div @click="batchUpdateStatus('已忽略')"
                    class="px-3 py-1.5 hover:bg-[#F2F3F5] text-[#86909C] cursor-pointer flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-[#86909C]"></span>
                    <span>已忽略</span>
                  </div>
                </div>
              </div>

              <!-- 右侧：下拉筛选与搜索框 (遵循 @comp-select 规范) -->
              <div class="flex items-center gap-3 flex-wrap">

                <!-- 1. 选择告警等级 -->
                <div class="dem-select-wrapper group">
                  <select x-model="filterLevel" @change="currentPage = 1" class="dem-select-fixed"
                    :class="!filterLevel ? 'text-[#8A92A1]' : 'text-[#2F3540]'">
                    <option value="" class="text-[#8A92A1]">全部告警等级</option>
                    <option value="紧急" class="text-[#2F3540]">紧急</option>
                    <option value="重要" class="text-[#2F3540]">重要</option>
                  </select>
                  <button type="button" x-show="filterLevel" @click.stop.prevent="filterLevel = ''; currentPage = 1"
                    class="dem-clear-btn has-value" title="清除选择">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12">
                      </path>
                    </svg>
                  </button>
                </div>

                <!-- 2. 选择告警状态 -->
                <div class="dem-select-wrapper group">
                  <select x-model="filterStatus" @change="currentPage = 1" class="dem-select-fixed"
                    :class="!filterStatus ? 'text-[#8A92A1]' : 'text-[#2F3540]'">
                    <option value="" class="text-[#8A92A1]">全部告警状态</option>
                    <option value="待处理" class="text-[#2F3540]">待处理</option>
                    <option value="已恢复" class="text-[#2F3540]">已恢复</option>
                    <option value="已忽略" class="text-[#2F3540]">已忽略</option>
                  </select>
                  <button type="button" x-show="filterStatus" @click.stop.prevent="filterStatus = ''; currentPage = 1"
                    class="dem-clear-btn has-value" title="清除选择">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12">
                      </path>
                    </svg>
                  </button>
                </div>

                <!-- 3. 选择告警类型 (单选：应用、用户、分支) -->
                <div class="dem-select-wrapper group">
                  <select x-model="filterAlarmType" @change="currentPage = 1" class="dem-select-fixed"
                    :class="!filterAlarmType ? 'text-[#8A92A1]' : 'text-[#2F3540]'">
                    <option value="" class="text-[#8A92A1]">全部告警类型</option>
                    <option value="应用" class="text-[#2F3540]">应用</option>
                    <option value="用户" class="text-[#2F3540]">用户</option>
                    <option value="分支" class="text-[#2F3540]">分支</option>
                  </select>
                  <button type="button" x-show="filterAlarmType"
                    @click.stop.prevent="filterAlarmType = ''; currentPage = 1" class="dem-clear-btn has-value"
                    title="清除选择">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12">
                      </path>
                    </svg>
                  </button>
                </div>

                <!-- 4. 选择告警对象 (合并用户与应用，预置文案“全部筛选对象”，点击下拉后支持搜索) -->
                <div class="dem-select-wrapper group" @click.outside="targetDropdownOpen = false">
                  <!-- 触发展示框 (规范 136px，高度 32px，与其它下拉完全对齐) -->
                  <div
                    @click="targetDropdownOpen = !targetDropdownOpen; if (targetDropdownOpen) $nextTick(() => $refs.targetSearchInput?.focus())"
                    class="dem-select-fixed flex items-center justify-between cursor-pointer select-none"
                    :class="targetDropdownOpen ? 'border-[#1C6EFF]' : ''" :title="filterTarget || '全部筛选对象'">
                    <span class="truncate pr-2" :class="!filterTarget ? 'text-[#8A92A1]' : 'text-[#2F3540]'"
                      x-text="filterTarget || '全部筛选对象'"></span>
                  </div>

                  <!-- 清空按钮 -->
                  <button type="button" x-show="filterTarget"
                    @click.stop.prevent="filterTarget = ''; targetSearchQuery = ''; currentPage = 1"
                    class="dem-clear-btn has-value" title="清除选择">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12">
                      </path>
                    </svg>
                  </button>

                  <!-- 搜索下拉面板 -->
                  <div x-show="targetDropdownOpen" x-transition:enter="transition ease-out duration-100"
                    x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
                    x-transition:leave="transition ease-in duration-75" x-transition:leave-start="opacity-100 scale-100"
                    x-transition:leave-end="opacity-0 scale-95"
                    class="absolute left-0 top-full mt-1 w-[210px] bg-white border border-[#D3D7DE] rounded-[2px] shadow-lg py-1 z-50 text-[12px]"
                    style="display: none;" @click.stop>
                    <!-- 顶部搜索输入框 -->
                    <div class="px-2 py-1.5 border-b border-[#F0F2F5]">
                      <div class="relative">
                        <span
                          class="absolute inset-y-0 left-0 flex items-center pl-2 pointer-events-none text-[#86909C]">
                          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                          </svg>
                        </span>
                        <input type="text" x-ref="targetSearchInput" x-model="targetSearchQuery" placeholder="搜索对象名称..."
                          class="w-full h-7 pl-7 pr-2 text-[12px] bg-[#F8FAFC] border border-[#E5E6EB] rounded-[2px] placeholder-[#86909C] text-[#1D2129] focus:outline-none focus:border-[#1C6EFF] focus:bg-white transition-colors" />
                      </div>
                    </div>

                    <!-- 选项列表 -->
                    <div class="max-h-[220px] overflow-y-auto dem-custom-scroll py-1">
                      <!-- 全部筛选对象 -->
                      <div
                        @click="filterTarget = ''; targetDropdownOpen = false; targetSearchQuery = ''; currentPage = 1"
                        class="px-3 py-1.5 cursor-pointer flex items-center justify-between transition-colors hover:bg-[#F2F3F5]"
                        :class="!filterTarget ? 'text-[#1C6EFF] font-medium bg-[#F0F5FF]' : 'text-[#2F3540]'">
                        <span>全部筛选对象</span>
                        <svg x-show="!filterTarget" class="w-3.5 h-3.5 text-[#1C6EFF]" fill="none" stroke="currentColor"
                          viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7">
                          </path>
                        </svg>
                      </div>

                      <!-- 分组选项 -->
                      <template x-for="grp in filteredTargetGroups" :key="grp.group">
                        <div>
                          <!-- 分组小标题 -->
                          <div
                            class="px-3 pt-2 pb-1 text-[11px] font-medium text-[#86909C] bg-[#FAFAFA] flex items-center gap-1 border-t border-[#F0F2F5] first:border-t-0 mt-1 first:mt-0">
                            <span x-text="grp.group"></span>
                          </div>
                          <!-- 分组内选项 -->
                          <template x-for="name in grp.items" :key="name">
                            <div
                              @click="filterTarget = name; targetDropdownOpen = false; targetSearchQuery = ''; currentPage = 1"
                              class="px-3 py-1.5 cursor-pointer flex items-center justify-between transition-colors hover:bg-[#F2F3F5]"
                              :class="filterTarget === name ? 'text-[#1C6EFF] font-medium bg-[#F0F5FF]' : 'text-[#2F3540]'">
                              <span class="truncate" x-text="name"></span>
                              <svg x-show="filterTarget === name" class="w-3.5 h-3.5 text-[#1C6EFF] flex-shrink-0"
                                fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M5 13l4 4L19 7"></path>
                              </svg>
                            </div>
                          </template>
                        </div>
                      </template>

                      <!-- 无搜索结果提示 -->
                      <div x-show="filteredTargetGroups.length === 0"
                        class="py-4 text-center text-[12px] text-[#86909C]">
                        无匹配对象
                      </div>
                    </div>
                  </div>
                </div>

                <!-- 搜索框 -->
                <div class="relative w-[230px]">
                  <span class="absolute inset-y-0 left-0 flex items-center pl-2.5 pointer-events-none text-[#86909C]">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                  </span>
                  <input type="text" x-model="searchKeyword" placeholder="搜索告警类型或对象..."
                    class="w-full h-8 pl-8 pr-3 text-[12px] bg-white border border-[#D3D7DE] rounded-[2px] placeholder-[#86909C] text-[#1D2129] focus:outline-none focus:border-[#1C6EFF] transition-colors" />
                </div>
              </div>
            </div>

            <!-- 告警数据表格（完全遵循 @comp-table 规范：表头吸顶且固定、内容独立滚动、操作列纯蓝） -->
            <div class="flex-1 min-h-0 overflow-auto dem-custom-scroll">
              <table class="dem-table">
                <!-- 表头 (规范高度 32px，背景 #EDF1F7，文字 12px 400 #454C59，带 16px 纵向分割线) -->
                <thead>
                  <tr>
                    <!-- 1. 多选框列 (固定宽度 40px，居中对齐) -->
                    <th class="w-[40px] text-center">
                      <input type="checkbox" class="dem-checkbox" x-model="selectAll" @change="toggleSelectAll()" />
                    </th>
                    <!-- 2. 告警对象 -->
                    <th class="w-[130px]">告警对象</th>
                    <!-- 3. 告警等级 -->
                    <th class="w-[75px]">告警等级</th>
                    <!-- 4. 告警类型 -->
                    <th class="w-[160px]">告警类型</th>
                    <!-- 5. 影响范围 -->
                    <th class="w-[90px]">影响范围</th>
                    <!-- 6. 告警信息 (自适应弹性填充) -->
                    <th class="min-w-[280px]">告警信息</th>
                    <!-- 7. 持续时长 -->
                    <th class="w-[190px]">持续时长</th>
                    <!-- 8. 告警状态 -->
                    <th class="w-[90px]">告警状态</th>
                    <!-- 9. 操作列 (默认左对齐，操作文字统一 #1C6EFF) -->
                    <th class="w-[60px]">操作</th>
                    <!-- 10. 更多列 / 列设置列 (规范 1.4.11：固定 40px，表头省略号，内容区空白，无右侧竖线) -->
                    <th class="w-[40px] text-center no-split" title="列设置">
                      <svg
                        class="w-3.5 h-3.5 mx-auto text-[#454C59] cursor-pointer hover:text-[#1C6EFF] transition-colors"
                        fill="currentColor" viewBox="0 0 24 24">
                        <circle cx="5" cy="12" r="1.75"></circle>
                        <circle cx="12" cy="12" r="1.75"></circle>
                        <circle cx="19" cy="12" r="1.75"></circle>
                      </svg>
                    </th>
                  </tr>
                </thead>

                <!-- 表格体 (行高自然舒适、无纵向分割线、hover态 #F8FAFC) -->
                <tbody>
                  <template x-for="item in paginatedAlarms" :key="item.id">
                    <tr>
                      <!-- 1. 复选框 (40px 居中) -->
                      <td class="w-[40px] text-center">
                        <input type="checkbox" class="dem-checkbox" :value="item.id" x-model="selectedIds"
                          @change="onSelectChange()" />
                      </td>

                      <!-- 2. 告警对象 (第1数据列，浅蓝Tag无跳转图标，常规字重) -->
                      <td class="w-[130px] whitespace-nowrap">
                        <a :href="getDetailUrl(item)" target="_blank"
                          class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-[2px] bg-[#E8F3FF] hover:bg-[#D4E8FF] text-[#1C6EFF] transition-colors group/tag"
                          :title="'在新标签页打开 ' + item.target + ' 详情'">
                          <!-- 应用图标 (线性蓝色) -->
                          <template x-if="item.type === '应用'">
                            <svg class="w-3.5 h-3.5 text-[#1C6EFF] flex-shrink-0" fill="none" stroke="currentColor"
                              viewBox="0 0 24 24">
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                                d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
                            </svg>
                          </template>
                          <!-- 用户图标 (线性蓝色) -->
                          <template x-if="item.type === '用户'">
                            <svg class="w-3.5 h-3.5 text-[#1C6EFF] flex-shrink-0" fill="none" stroke="currentColor"
                              viewBox="0 0 24 24">
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                          </template>
                          <!-- 分支图标 (线性蓝色) -->
                          <template x-if="item.type === '分支'">
                            <svg class="w-3.5 h-3.5 text-[#1C6EFF] flex-shrink-0" fill="none" stroke="currentColor"
                              viewBox="0 0 24 24">
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                                d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4">
                              </path>
                            </svg>
                          </template>
                          <span class="text-[12px] font-normal" x-text="item.target"></span>
                        </a>
                      </td>

                      <!-- 3. 告警等级 -->
                      <td class="w-[75px] whitespace-nowrap">
                        <template x-if="item.level === '紧急'">
                          <span
                            class="inline-flex items-center px-1.5 py-0.5 rounded-[2px] text-[11px] bg-[#FFECE8] text-[#F53F3F] font-normal">紧急</span>
                        </template>
                        <template x-if="item.level === '重要'">
                          <span
                            class="inline-flex items-center px-1.5 py-0.5 rounded-[2px] text-[11px] bg-[#FFF7E8] text-[#FF7D00] font-normal">重要</span>
                        </template>
                      </td>

                      <!-- 4. 告警类型 (常规字重) -->
                      <td class="w-[160px] whitespace-nowrap">
                        <span class="text-[#2F3540] font-normal" x-text="item.alarmType"></span>
                      </td>

                      <!-- 5. 影响范围 (精炼无口语：用户：3 分支：3，不加粗，无图标) -->
                      <td class="w-[90px] whitespace-nowrap">
                        <div class="flex flex-col gap-0.5 text-[12px] text-[#4E5969] font-normal">
                          <div>用户：<span x-text="item.impactUsersCount"></span></div>
                          <div><span x-text="item.impactSecondLabel"></span>：<span
                              x-text="item.impactSecondCount"></span></div>
                        </div>
                      </td>

                      <!-- 6. 告警信息 (纯文本项目符号表达，无红Tag) -->
                      <td class="min-w-[280px]">
                        <div class="flex flex-col gap-1 text-[12px] text-[#4E5969] leading-snug">
                          <template x-for="(bullet, bIdx) in item.infoBullets" :key="bIdx">
                            <div class="flex items-start gap-1.5">
                              <span class="text-[#86909C] flex-shrink-0">•</span>
                              <span x-text="bullet"></span>
                            </div>
                          </template>
                        </div>
                      </td>

                      <!-- 7. 持续时长 (已恢复无tag，持续中为低调灰色tag) -->
                      <td class="w-[190px] whitespace-nowrap">
                        <div class="flex flex-col gap-0.5 leading-tight">
                          <div class="text-[#4E5969] font-mono text-[12px]" x-text="item.timeRangeDisplay"></div>
                          <div class="flex items-center gap-2 mt-0.5">
                            <span class="text-[#86909C] text-[11px]" x-text="item.durationText"></span>
                            <template x-if="item.isOngoing">
                              <span
                                class="inline-flex items-center px-1.5 py-0.5 rounded-[2px] text-[11px] bg-[#F2F3F5] text-[#86909C] font-normal">
                                持续中
                              </span>
                            </template>
                          </div>
                        </div>
                      </td>

                      <!-- 8. 告警状态 (无边框、无底色、轻量下拉操作) -->
                      <td class="w-[90px] whitespace-nowrap">
                        <div class="relative inline-block text-left"
                          @click.outside="if (statusDropdownRowId === item.id) statusDropdownRowId = null">
                          <button type="button"
                            @click="statusDropdownRowId = (statusDropdownRowId === item.id ? null : item.id)"
                            class="inline-flex items-center gap-1.5 text-[12px] py-1 px-1 rounded hover:bg-[#F2F3F5] transition-colors cursor-pointer bg-transparent border-0 outline-none group/status"
                            title="点击切换状态">
                            <span class="w-1.5 h-1.5 rounded-full inline-block" :class="{
                                  'bg-[#F53F3F]': item.status === '待处理',
                                  'bg-[#00B42A]': item.status === '已恢复',
                                  'bg-[#86909C]': item.status === '已忽略'
                                }"></span>
                            <span :class="{
                                  'text-[#F53F3F]': item.status === '待处理',
                                  'text-[#00B42A]': item.status === '已恢复',
                                  'text-[#86909C]': item.status === '已忽略'
                                }" x-text="item.status"></span>
                            <svg
                              class="w-2.5 h-2.5 text-[#86909C] transition-transform duration-150 group-hover/status:text-[#1D2129]"
                              :class="statusDropdownRowId === item.id && 'rotate-180'" fill="none" stroke="currentColor"
                              viewBox="0 0 24 24">
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7">
                              </path>
                            </svg>
                          </button>

                          <div x-show="statusDropdownRowId === item.id"
                            x-transition:enter="transition ease-out duration-100"
                            x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
                            x-transition:leave="transition ease-in duration-75"
                            x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95"
                            class="absolute left-0 top-full mt-1 w-24 bg-white border border-[#E5E6EB] rounded-[3px] shadow-lg py-1 z-30 text-[12px]"
                            style="display: none;">
                            <div @click="setRowStatus(item, '待处理')"
                              class="px-2.5 py-1.5 hover:bg-[#F2F3F5] text-[#F53F3F] cursor-pointer flex items-center gap-1.5">
                              <span class="w-1.5 h-1.5 rounded-full bg-[#F53F3F]"></span>
                              <span>待处理</span>
                            </div>
                            <div @click="setRowStatus(item, '已恢复')"
                              class="px-2.5 py-1.5 hover:bg-[#F2F3F5] text-[#00B42A] cursor-pointer flex items-center gap-1.5">
                              <span class="w-1.5 h-1.5 rounded-full bg-[#00B42A]"></span>
                              <span>已恢复</span>
                            </div>
                            <div @click="setRowStatus(item, '已忽略')"
                              class="px-2.5 py-1.5 hover:bg-[#F2F3F5] text-[#86909C] cursor-pointer flex items-center gap-1.5">
                              <span class="w-1.5 h-1.5 rounded-full bg-[#86909C]"></span>
                              <span>已忽略</span>
                            </div>
                          </div>
                        </div>
                      </td>

                      <!-- 9. 操作列 (规范 1.4.7：统一蓝色 #1C6EFF，默认左对齐) -->
                      <td class="w-[60px] whitespace-nowrap">
                        <a :href="getDetailUrl(item)" target="_blank"
                          class="text-[#1C6EFF] hover:text-[#4FA1FF] text-[12px] cursor-pointer"
                          :title="'新开标签页打开 ' + item.target + ' 详情'">详情</a>
                      </td>

                      <!-- 10. 更多列内容区 (规范 1.4.11：固定 40px，内容区为空白单元格，不承载操作) -->
                      <td class="w-[40px]"></td>
                    </tr>
                  </template>

                  <!-- 无数据缺省态 -->
                  <tr x-show="filteredAlarms.length === 0">
                    <td colspan="10" class="py-12 text-center text-[#86909C] text-[13px]">
                      <div class="flex flex-col items-center justify-center gap-2">
                        <svg class="w-8 h-8 text-[#C9CDD4]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z">
                          </path>
                        </svg>
                        <span>暂未检索到匹配的告警事件</span>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>

            <!-- 底部吸底分页器 (@comp-table 分页器规范：高度40px、吸底、包含总数+单页条数+页码+快速跳转32px*48px) -->
            <div class="dem-pagination-bar select-none flex-shrink-0">
              <span>共 <strong class="text-[#2F3540] font-medium" x-text="filteredAlarms.length"></strong> 条数据</span>
              <div class="flex items-center gap-1.5">
                <span>每页显示</span>
                <select x-model.number="pageSize" @change="currentPage = 1"
                  class="h-8 text-xs bg-white border border-[#D3D7DE] rounded-[2px] px-2 focus:outline-none focus:border-[#1C6EFF] text-[#2F3540] cursor-pointer">
                  <option :value="10">10 条</option>
                  <option :value="20">20 条</option>
                  <option :value="50">50 条</option>
                </select>
              </div>
              <div class="flex items-center gap-1">
                <button class="dem-page-btn" :class="currentPage === 1 && 'disabled'"
                  @click="changePage(currentPage - 1)">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                  </svg>
                </button>
                <template x-for="p in totalPages" :key="p">
                  <button class="dem-page-btn" :class="currentPage === p && 'active'" @click="changePage(p)"
                    x-text="p"></button>
                </template>
                <button class="dem-page-btn" :class="currentPage === totalPages && 'disabled'"
                  @click="changePage(currentPage + 1)">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                  </svg>
                </button>
              </div>
              <div class="flex items-center gap-1.5">
                <span>前往</span>
                <input type="number" x-model="jumpPageInput" @keyup.enter="handleJumpPage()" min="1" :max="totalPages"
                  class="dem-page-jump-input" />
                <span>页</span>
              </div>
            </div>

          </div>

        </div>

        <!-- 3. 主体工作区 - Tab 2: 告警策略 -->
        <div x-show="currentTab === 'alarmPolicy'" class="flex-1 bg-[#EDF1F7] overflow-hidden px-3 pt-2 pb-3 flex flex-col" style="display: none;">

          <!-- 3.2 策略卡片表格容器 (包含纯白底色工具栏) -->
          <div class="flex-1 bg-white rounded-[2px] border border-[#E1E5EB] shadow-2xs flex flex-col overflow-hidden">

            <!-- 3.1 操作栏 (底色为纯白色，无加号图标) -->
            <div class="px-3 py-2.5 bg-white border-b border-[#EDF1F7] flex items-center justify-between flex-shrink-0 select-none">
              <!-- 左侧操作按钮组 -->
              <div class="flex items-center gap-2">
                <!-- 新增策略 (去掉左侧加号图标) -->
                <button type="button" @click="openAddPolicyDrawer()"
                  class="h-8 px-3.5 bg-[#1C6EFF] hover:bg-[#4086FF] text-white rounded-[2px] flex items-center text-[12px] font-medium transition-colors shadow-2xs cursor-pointer">
                  <span>新增策略</span>
                </button>

                <!-- 批量启用 -->
                <button type="button" @click="batchEnablePolicies()" :disabled="selectedPolicyIds.length === 0"
                  class="h-8 px-3 rounded-[2px] text-[12px] transition-colors border shadow-2xs"
                  :class="selectedPolicyIds.length > 0 ? 'bg-white border-[#D9D9D9] text-[#2F3540] hover:border-[#1C6EFF] hover:text-[#1C6EFF] cursor-pointer' : 'bg-[#F5F5F5] border-[#E5E6EB] text-[#C9CDD4] cursor-not-allowed'">
                  <span>启用</span>
                </button>

                <!-- 批量禁用 -->
                <button type="button" @click="batchDisablePolicies()" :disabled="selectedPolicyIds.length === 0"
                  class="h-8 px-3 rounded-[2px] text-[12px] transition-colors border shadow-2xs"
                  :class="selectedPolicyIds.length > 0 ? 'bg-white border-[#D9D9D9] text-[#2F3540] hover:border-[#1C6EFF] hover:text-[#1C6EFF] cursor-pointer' : 'bg-[#F5F5F5] border-[#E5E6EB] text-[#C9CDD4] cursor-not-allowed'">
                  <span>禁用</span>
                </button>

                <!-- 批量删除 (激活时与其它按钮字体同色，不使用红色) -->
                <button type="button" @click="batchDeletePolicies()" :disabled="selectedPolicyIds.length === 0"
                  class="h-8 px-3 rounded-[2px] text-[12px] transition-colors border shadow-2xs"
                  :class="selectedPolicyIds.length > 0 ? 'bg-white border-[#D9D9D9] text-[#2F3540] hover:border-[#1C6EFF] hover:text-[#1C6EFF] cursor-pointer' : 'bg-[#F5F5F5] border-[#E5E6EB] text-[#C9CDD4] cursor-not-allowed'">
                  <span>删除</span>
                </button>
              </div>

              <!-- 右侧筛选检索区 -->
              <div class="flex items-center gap-2">
                <!-- 告警等级多选筛选 (位于搜索框左侧) -->
                <div class="relative select-none dem-level-wrapper" @click.outside="policyLevelMenuOpen = false">
                  <button type="button" @click="policyLevelMenuOpen = !policyLevelMenuOpen"
                    class="h-8 min-w-[136px] max-w-[200px] pl-3 pr-8 bg-white border rounded-[2px] flex items-center text-left text-xs transition-colors shadow-2xs cursor-pointer relative"
                    :class="policyLevelFilter.length > 0 ? 'border-[#1C6EFF] text-[#2F3540]' : 'border-[#D9D9D9] text-[#2F3540] hover:border-[#1C6EFF]'">
                    <span class="truncate" :class="policyLevelFilter.length > 0 ? 'text-[#2F3540]' : 'text-[#8C8C8C]'"
                      x-text="policyLevelFilter.length > 0 ? policyLevelFilter.join('、') : '告警等级'"></span>
                    <svg class="dem-level-arrow w-3.5 h-3.5 absolute right-2.5 text-[#8C8C8C] transition-transform"
                      :class="[policyLevelMenuOpen && 'rotate-180', policyLevelFilter.length > 0 && 'has-value']" fill="none"
                      stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                  </button>
                  <button type="button" x-show="policyLevelFilter.length > 0" @click.stop.prevent="policyLevelFilter = []"
                    class="dem-level-clear has-value" title="清除选择">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                  </button>
                  <div x-show="policyLevelMenuOpen"
                    class="absolute top-9 left-0 bg-white border border-[#E5E6EB] shadow-lg rounded-[2px] py-1 z-40 min-w-[136px] text-xs"
                    style="display: none;">
                    <template x-for="level in ['紧急', '重要', '次要', '提示']" :key="level">
                      <div @click="togglePolicyLevel(level)"
                        class="px-2.5 py-1.5 hover:bg-[#F2F3F5] cursor-pointer flex items-center gap-2 text-[#2F3540]">
                        <input type="checkbox" :checked="policyLevelFilter.includes(level)"
                          class="accent-[#1C6EFF] w-3.5 h-3.5 rounded-[2px] pointer-events-none" />
                        <span x-text="level"></span>
                      </div>
                    </template>
                  </div>
                </div>

                <div class="relative flex items-center">
                  <input type="text" x-model="policySearchKeyword" placeholder="搜索策略名称/类型/对象..."
                    class="h-8 w-56 pl-3 pr-8 bg-white border border-[#D9D9D9] rounded-[2px] text-xs text-[#2F3540] placeholder-[#8C8C8C] outline-none focus:border-[#1C6EFF] transition-colors shadow-2xs" />
                  <svg class="w-3.5 h-3.5 text-[#8C8C8C] absolute right-2.5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                  </svg>
                </div>

                <!-- 刷新按钮 -->
                <button type="button" @click="refreshData()"
                  class="w-8 h-8 bg-white border border-[#D9D9D9] hover:border-[#1C6EFF] hover:text-[#1C6EFF] rounded-[2px] flex items-center justify-center text-[#595959] transition-colors shadow-2xs cursor-pointer group"
                  title="刷新数据">
                  <svg class="w-3.5 h-3.5 text-[#595959] group-hover:text-[#1C6EFF] transition-transform duration-300"
                    :class="isRefreshing && 'animate-spin'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                    </path>
                  </svg>
                </button>
              </div>
            </div>

            <div class="flex-1 overflow-auto dem-custom-scroll">
              <table class="dem-table">
                <thead>
                  <tr>
                    <!-- 1. 复选框列 -->
                    <th class="w-[40px] text-center">
                      <input type="checkbox" :checked="isAllPoliciesSelected" @change="toggleSelectAllPolicies()"
                        class="accent-[#1C6EFF] w-3.5 h-3.5 rounded-[2px] cursor-pointer align-middle" />
                    </th>
                    <!-- 2. 策略名称 -->
                    <th class="text-left w-[200px]">策略名称</th>
                    <!-- 3. 告警等级 -->
                    <th class="text-left w-[100px]">告警等级</th>
                    <!-- 4. 告警类型 -->
                    <th class="text-left w-[110px]">告警类型</th>
                    <!-- 5. 告警对象 -->
                    <th class="text-left min-w-[200px]">告警对象</th>
                    <!-- 6. 告警动作 -->
                    <th class="text-left w-[160px]">告警动作</th>
                    <!-- 7. 状态 -->
                    <th class="text-left w-[110px]">状态</th>
                    <!-- 8. 创建人 -->
                    <th class="text-left w-[110px]">创建人</th>
                    <!-- 9. 操作列 -->
                    <th class="text-left w-[90px]">操作</th>
                    <!-- 10. 占位列 -->
                    <th class="w-[40px]"></th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="item in filteredPolicies" :key="item.id">
                    <tr class="hover:bg-[#F7F8FA] transition-colors border-b border-[#EDF1F7]">
                      <!-- 1. 复选框 -->
                      <td class="text-center">
                        <input type="checkbox" :checked="selectedPolicyIds.includes(item.id)" @change="toggleSelectPolicy(item.id)"
                          class="accent-[#1C6EFF] w-3.5 h-3.5 rounded-[2px] cursor-pointer align-middle" />
                      </td>

                      <!-- 2. 策略名称 (蓝色可点击，点击等同编辑) -->
                      <td>
                        <span class="text-[#1C6EFF] hover:text-[#4086FF] cursor-pointer transition-colors"
                          @click="openEditPolicyDrawer(item)" x-text="item.name"></span>
                      </td>

                      <!-- 3. 告警等级 (Tag) -->
                      <td>
                        <span x-show="item.level === '紧急'"
                          class="inline-flex items-center px-2 py-0.5 rounded-[2px] text-[11px] font-medium bg-[#FFECE8] text-[#F53F3F]">紧急</span>
                        <span x-show="item.level === '重要'"
                          class="inline-flex items-center px-2 py-0.5 rounded-[2px] text-[11px] font-medium bg-[#FFF7E8] text-[#FF7D00]">重要</span>
                        <span x-show="item.level === '次要'"
                          class="inline-flex items-center px-2 py-0.5 rounded-[2px] text-[11px] font-medium bg-[#FFFBE6] text-[#D48806]">次要</span>
                        <span x-show="item.level === '提示'"
                          class="inline-flex items-center px-2 py-0.5 rounded-[2px] text-[11px] font-medium bg-[#F2F3F5] text-[#86909C]">提示</span>
                      </td>

                      <!-- 4. 告警类型 -->
                      <td>
                        <span class="text-[#2F3540]" x-text="item.type"></span>
                      </td>

                      <!-- 5. 告警对象 (带对应图标的蓝标与小字说明) -->
                      <td>
                        <div class="flex flex-col gap-1 py-1">
                          <div class="flex items-center gap-1.5 flex-wrap">
                            <template x-for="(tgt, idx) in item.targets" :key="idx">
                              <span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-[2px] text-[11px] bg-[#E8F3FF] text-[#1C6EFF]">
                                <!-- 分支图标 -->
                                <svg x-show="tgt.type === 'branch' || item.targetType === '分支'" class="w-3 h-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                                </svg>
                                <!-- 应用图标 -->
                                <svg x-show="tgt.type === 'app' || item.targetType === '应用'" class="w-3 h-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
                                </svg>
                                <!-- 用户图标 -->
                                <svg x-show="tgt.type === 'user' || item.targetType === '用户'" class="w-3 h-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                </svg>
                                <span x-text="tgt.name"></span>
                              </span>
                            </template>
                            <span x-show="item.targets && item.targets.length > 2" class="text-[11px] text-[#86909C]">等 1 项</span>
                          </div>
                          <span class="text-[11px] text-[#86909C]" x-text="item.type"></span>
                        </div>
                      </td>

                      <!-- 6. 告警动作 -->
                      <td>
                        <span class="text-[#2F3540]" x-text="item.action"></span>
                      </td>

                      <!-- 7. 状态 (带绿/灰圆点的切换下拉) -->
                      <td>
                        <div class="relative inline-block select-none"
                          @click.outside="if (policyStatusMenuId === item.id) policyStatusMenuId = null">
                          <button type="button" @click.stop="policyStatusMenuId = (policyStatusMenuId === item.id ? null : item.id)"
                            class="inline-flex items-center gap-1.5 py-1 px-1.5 rounded hover:bg-[#F2F3F5] cursor-pointer text-xs">
                            <span class="w-1.5 h-1.5 rounded-full" :class="item.status === '启用' ? 'bg-[#00B42A]' : 'bg-[#86909C]'"></span>
                            <span :class="item.status === '启用' ? 'text-[#2F3540]' : 'text-[#86909C]'" x-text="item.status"></span>
                            <svg class="w-3 h-3 text-[#86909C]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                          </button>
                          <div x-show="policyStatusMenuId === item.id"
                            class="absolute top-7 left-0 bg-white border border-[#E5E6EB] shadow-lg rounded-[2px] py-1 z-30 min-w-[76px] text-xs"
                            style="display: none;">
                            <div @click="setPolicyStatus(item, '启用')"
                              class="px-2.5 py-1 hover:bg-[#F2F3F5] cursor-pointer flex items-center gap-1.5 text-[#2F3540]">
                              <span class="w-1.5 h-1.5 rounded-full bg-[#00B42A]"></span>
                              <span>启用</span>
                            </div>
                            <div @click="setPolicyStatus(item, '禁用')"
                              class="px-2.5 py-1 hover:bg-[#F2F3F5] cursor-pointer flex items-center gap-1.5 text-[#86909C]">
                              <span class="w-1.5 h-1.5 rounded-full bg-[#86909C]"></span>
                              <span>禁用</span>
                            </div>
                          </div>
                        </div>
                      </td>

                      <!-- 8. 创建人 -->
                      <td>
                        <span class="text-[#2F3540]" x-text="item.creator"></span>
                      </td>

                      <!-- 9. 操作 (编辑、删除) -->
                      <td>
                        <div class="flex items-center gap-3 whitespace-nowrap">
                          <button type="button" @click="openEditPolicyDrawer(item)"
                            class="text-[#1C6EFF] hover:text-[#4086FF] text-[12px] cursor-pointer">编辑</button>
                          <button type="button" @click="deletePolicy(item.id)"
                            class="text-[#1C6EFF] hover:text-[#F53F3F] text-[12px] cursor-pointer">删除</button>
                        </div>
                      </td>

                      <!-- 10. 占位列 -->
                      <td class="w-[40px]"></td>
                    </tr>
                  </template>

                  <!-- 无匹配数据缺省态 -->
                  <tr x-show="filteredPolicies.length === 0">
                    <td colspan="10" class="py-12 text-center text-[#86909C] text-[13px]">
                      <div class="flex flex-col items-center justify-center gap-2">
                        <svg class="w-8 h-8 text-[#C9CDD4]" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                      <div class="flex-1 relative flex items-center">
                        <select x-model="policyForm.level"

                          <option value="重要" class="text-[#2F3540]">重要</option>
                          <option value="次要" class="text-[#2F3540]">次要</option>

                        </select>
                        <div class="absolute right-3 pointer-events-none text-[#86909C] flex items-center">

                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                          </svg>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                          <span class="text-[#2F3540]">分支</span>
                        </label>

                      </label>
                      <div class="flex-1 relative flex items-center">
                        <select x-model="policyForm.targetInput"

                            <optgroup label="常用监控应用">

                              <option value="ERP系统">ERP系统</option>
                              <option value="邮件服务">邮件服务</option>

                              <option value="CRM客户关系管理">CRM客户关系管理</option>

                          <template x-if="policyForm.targetType === '分支'">

                            </optgroup>
                          </template>
                        </select>
                        <div class="absolute right-3 pointer-events-none text-[#86909C] flex items-center">
                          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                          </svg>
                        </div>
                      </div>
                    </div>

                    <!-- 告警条件 (三个条件直接展示，上方说明生效逻辑是或) -->

                        <div class="flex items-center gap-1.5 px-3 py-1.5 bg-[#F0F5FF] border border-[#D6E4FF] rounded-[2px] text-xs text-[#1D39C4] mb-2.5">

                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>

                        <div class="bg-[#F7F8FA] border border-[#E5E6EB] rounded-[4px] p-3 space-y-2.5 text-xs text-[#2F3540]">

                          <div class="flex items-center flex-wrap gap-2 leading-relaxed">
                            <span class="w-4 h-4 rounded-full bg-[#E8F3FF] text-[#1C6EFF] flex items-center justify-center font-medium text-[10px] flex-shrink-0">1</span>

                              <option value="差">差</option>
                              <option value="一般">一般</option>
                            </select>
                          </div>

                            <span>在</span>
                            <input type="number" x-model.number="policyForm.cond3Minutes"

                            <input type="number" x-model.number="policyForm.cond3BranchCount"

                            <select x-model="policyForm.cond3Status"

                              <option value="差">差</option>
                              <option value="一般">一般</option>
                            </select>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                    <span class="text-[14px] font-[600] text-[#2F3540]">告警动作</span>
                  </div>

                  <div class="space-y-4 text-xs">
                    <!-- 动作类型切换 -->
                    <div class="flex items-start">
                      <label class="w-[88px] pt-1 text-[#4E5969] flex-shrink-0 select-none">
                        <span class="text-[#F53F3F] mr-0.5">*</span>动作模式
                      </label>
                      <div class="flex-1 space-y-3">
                        <div class="flex items-center gap-6">
                          <label class="flex items-center gap-2 cursor-pointer select-none">
                            <input type="radio" value="none" x-model="policyForm.actionType" class="accent-[#1C6EFF] cursor-pointer" />

                          <label class="flex items-center gap-2 cursor-pointer select-none">

                              <input type="checkbox" x-model="policyForm.actionEmail" class="accent-[#1C6EFF] w-4 h-4 rounded-[2px] cursor-pointer" />

                            <div x-show="policyForm.actionEmail" class="pl-6" style="display: none;">

                            </div>
                          </div>

                          <!-- 渠道 2: 微信通知 -->

                            <label class="flex items-center gap-2 cursor-pointer select-none text-xs font-normal text-[#2F3540]">
                              <input type="checkbox" x-model="policyForm.actionWechat" class="accent-[#1C6EFF] w-4 h-4 rounded-[2px] cursor-pointer" />

                            </div>
                          </div>
                        </div>

                        <p class="text-[11px] text-[#86909C]">
                          说明：配置为“仅生成告警事件”时，仅在系统内“体验预警”列表中记录告警明细，不向外部推送；配置通知后支持按配置渠道实时触达责任人。
                        </p>
                      </div>
                    </div>
                  </div>
                </div>

              </div>

                <button type="button" @click="savePolicyForm()"

        <div x-show="toast.show"
