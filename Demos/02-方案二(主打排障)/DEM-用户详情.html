            tag: 'SaaS应用',

                successRate: '98.5%',

                sampleIdx: 14,
                topology: {
                  client: { name: 'ThinkPad X1', sub: '终端', status: '正常' },
                  segment1: { name: 'WiFi', delay: '20ms', loss: '0.1%', status: '正常', targetId: 'seg_client_pop' },
                  pop: { name: '北京POP', sub: 'POP节点', status: '正常' },
                  segment2: { name: '连接器', delay: '30ms', loss: '0.0%', status: '正常', targetId: 'seg_pop_gw' },
                  gw: { name: 'GW连接器', sub: '连接器', status: '正常' },
                  segment3: { name: '应用', delay: '25ms', loss: '0.0%', status: '正常', targetId: 'seg_gw_app' },
                  app: { name: '飞书平台', sub: '应用', status: '正常', targetId: 'node_app' }
                },
                segmentDetails: [],
                nodeDetails: []
              }
            ]
          },
          {
            id: 'app_gitlab',
            name: '内网 GitLab',
            domain: 'https://git.internal.net',
            experience: '正常',
            tag: '内网应用',
            summary: 'GitLab 访问体验正常。',
            abnormalExplain: '全链路指标正常。',
            slices: [
              {
                id: 'slice_1',
                name: '切片1',
                time: '16:00',
                range: '15:55~16:00',
                successRate: '99.9%',
                status: '正常',
                sampleIdx: 99,
                topology: {
                  client: { name: 'ThinkPad X1', sub: '终端', status: '正常' },
                  segment1: { name: 'WiFi', delay: '15ms', loss: '0.0%', status: '正常', targetId: 'seg_client_pop' },
                  pop: { name: '北京POP', sub: 'POP节点', status: '正常' },
                  segment2: { name: '连接器', delay: '20ms', loss: '0.0%', status: '正常', targetId: 'seg_pop_gw' },
                  gw: { name: 'GW连接器', sub: '连接器', status: '正常' },
                  segment3: { name: '应用', delay: '15ms', loss: '0.0%', status: '正常', targetId: 'seg_gw_app' },
                  app: { name: 'GitLab', sub: '应用', status: '正常', targetId: 'node_app' }
                },
                segmentDetails: [],
                nodeDetails: []
              }
            ]
          }
        ],

        init() {
          // 生成 100 个采样点 (精准控制只有 3 个红条与上面 3 个切片时间严格对齐，避免数据太假)
          const points = [];
          for (let i = 0; i < 100; i++) {
            let exp = '正常';
            let ttfb = Math.floor(Math.random() * 15 + 65);

            // 精准让 88 (15:20), 27 (10:15), 8 (08:40) 三点为异常红条，与切片1、2、3严格一致
            if (i === 88 || i === 27 || i === 8) {
              exp = '差';
              ttfb = Math.floor(Math.random() * 80 + 580);
            } else if (i === 42) {
              exp = '一般';
              ttfb = 185;
            }

            const totalMinutes = 8 * 60 + i * 4.8;
            const h = String(Math.floor(totalMinutes / 60) % 24).padStart(2, '0');
            const m = String(Math.floor(totalMinutes % 60)).padStart(2, '0');

            points.push({
              id: i,
              time: `${h}:${m}`,
              experience: exp,
              ttfb: ttfb
            });
          }
          this.samplePoints = points;

          // 默认展开当前切片下所有的异常项
          this.autoExpandAbnormalItems();
        },

        // 统一计算属性：合并链路段和节点，先按异常降序，再按物理链路从左到右 (Order 1..7)
        get currentSliceDetails() {
          const slice = this.currentSlice;
          if (!slice) return [];

          const itemOrderMap = {
            'node_terminal': 1,
            'seg_client_pop': 2,
            'node_pop': 3,
            'seg_pop_gw': 4,
            'node_connector': 5,
            'seg_gw_app': 6,
            'node_app': 7
          };

          const list = [];
          (slice.segmentDetails || []).forEach(seg => {
            list.push({ ...seg, itemType: 'segment', order: itemOrderMap[seg.id] || 99 });
          });
          (slice.nodeDetails || []).forEach(node => {
            list.push({ ...node, itemType: 'node', order: itemOrderMap[node.id] || 99 });
          });

          return list.sort((a, b) => {
            const aAbn = a.status === '异常' ? 0 : 1;
            const bAbn = b.status === '异常' ? 0 : 1;
            if (aAbn !== bAbn) return aAbn - bAbn;
            return a.order - b.order;
          });
        },

        // 自动将所有异常项加入 openItemIds 默认展开显示出来
        autoExpandAbnormalItems() {
          const details = this.currentSliceDetails;
          const abnIds = details.filter(item => item.status === '异常').map(item => item.id);
          if (abnIds.length > 0) {
            this.openItemIds = abnIds;
          } else if (details.length > 0) {
            this.openItemIds = [details[0].id];
          } else {
            this.openItemIds = [];
          }
        },

        toggleItem(id) {
          if (this.openItemIds.includes(id)) {
            this.openItemIds = this.openItemIds.filter(i => i !== id);
          } else {
            this.openItemIds.push(id);
          }
        },

        isItemOpen(id) {
          return this.openItemIds.includes(id);
        },

        // 计算属性：按照 差 > 一般 > 正常 降序排列 App 列表
        get filteredApps() {
          const expOrder = { '差': 1, '一般': 2, '正常': 3 };
          let list = [...this.rawAppList];
          
          if (this.appFilter === 'degraded') {
            list = list.filter(a => a.experience === '差' || a.experience === '一般');
          }

          return list.sort((a, b) => (expOrder[a.experience] || 99) - (expOrder[b.experience] || 99));
        },

        get currentApp() {
          return this.rawAppList.find(a => a.id === this.activeAppId) || this.rawAppList[0];
        },

        get currentSlice() {
          const slices = this.currentApp.slices || [];
          return slices.find(s => s.id === this.activeSliceId) || slices[0] || {};
        },

        // 切换选中的应用
        selectApp(app) {
          this.activeAppId = app.id;
          if (app.slices && app.slices.length > 0) {
            this.activeSliceId = app.slices[0].id;
            this.selectedSampleIdx = app.slices[0].sampleIdx !== undefined ? app.slices[0].sampleIdx : 88;
          }
          this.autoExpandAbnormalItems();
        },

        // 切换异常切片
        selectSlice(slice) {
          this.activeSliceId = slice.id;
          this.selectedSampleIdx = slice.sampleIdx !== undefined ? slice.sampleIdx : 88;
          this.autoExpandAbnormalItems();
        },

        // 当前高亮被点击的链路元素 ID
        highlightedItemId: null,

        // 拓扑图节点与链路段点击联动 (自动展开 + 居中平滑滚动 + 蓝光高亮反馈)
        clickTopologyItem(type, targetId) {
          if (!targetId) return;
          if (!this.openItemIds.includes(targetId)) {
            this.openItemIds.push(targetId);
          }
          this.highlightedItemId = targetId;
          setTimeout(() => {
            if (this.highlightedItemId === targetId) {
              this.highlightedItemId = null;
            }
          }, 2000);
          this.scrollToElement(targetId);
        },

        scrollToElement(id) {
          // 用 x-ref 直接引用当前组件内的滚动容器，完全避免多实例 ID 冲突
          // 等 x-collapse 动画（~300ms）完成后再湋定位置
          setTimeout(() => {
            const container = this.$refs.detailScrollPanel;
            if (!container) return;
            const el = container.querySelector(`[id="${id}"]`);
            if (!el) return;

            const containerRect = container.getBoundingClientRect();
            const elRect = el.getBoundingClientRect();
            const elCenterOffset = elRect.top - containerRect.top + elRect.height / 2;
            const targetScrollTop = container.scrollTop + elCenterOffset - containerRect.height / 2;

            container.scrollTo({
              top: Math.max(0, targetScrollTop),
              behavior: 'smooth'
            });
          }, 400);
        },

        goBackUserList() {
          if (document.referrer && (document.referrer.includes('DEM-') || document.referrer.includes('html'))) {
            window.history.back();
          } else {
            window.location.href = './DEM-排障定位.html';
          }
        }
      };
    }
  </script>
</head>

                                  </div>

                                <div class="bg-white border border-[#E1E5EB] p-3 rounded-[2px] shadow-xs flex flex-col justify-between">

                                  </div>
                                  <div class="h-20 w-full bg-[#FAFBFD] rounded border border-[#F1F5F9] p-1.5">

                                    </svg>
                                  </div>
                                </div>

                                <!-- 内存使用率趋势图 -->
                                <div class="bg-white border border-[#E1E5EB] p-3 rounded-[2px] shadow-xs flex flex-col justify-between">
                                  <div class="flex items-center justify-between text-xs mb-2">
                                    <span class="font-medium text-[#2F3540]">内存使用率 <span class="text-[10px] text-[#94A3B8]">(5分钟遥测)</span></span>
                                    <div class="flex items-center gap-2 text-[10px]">
                                      <span class="inline-flex items-center gap-1 text-[#8B5CF6]"><span class="w-1.5 h-1.5 rounded-full bg-[#8B5CF6]"></span> 68.2%</span>
                                      <span class="text-[#94A3B8]">基线 60%</span>
                                    </div>
                                  </div>
                                  <div class="h-20 w-full bg-[#FAFBFD] rounded border border-[#F1F5F9] p-1.5">
                                    <svg viewBox="0 0 200 50" class="w-full h-full overflow-visible">
                                      <line x1="0" y1="30" x2="200" y2="30" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3 2"/>
                                      <polyline fill="none" stroke="#8B5CF6" stroke-width="1.8" points="0,32 40,30 80,26 100,18 120,12 160,22 200,25"/>
                                      <circle cx="0" cy="32" r="2" fill="#8B5CF6"/><circle cx="40" cy="30" r="2" fill="#8B5CF6"/><circle cx="80" cy="26" r="2" fill="#8B5CF6"/><circle cx="120" cy="12" r="2" fill="#8B5CF6"/><circle cx="160" cy="22" r="2" fill="#8B5CF6"/><circle cx="200" cy="25" r="2" fill="#8B5CF6"/>
                                    </svg>
                                  </div>
                                </div>

                                <!-- WiFi 信号强度 (RSSI) 趋势图 -->
                                <div class="bg-white border border-[#E1E5EB] p-3 rounded-[2px] shadow-xs flex flex-col justify-between">

                                    <div class="flex items-center gap-2 text-[10px]">
                                      <span class="inline-flex items-center gap-1 text-[#06B6D4]"><span class="w-1.5 h-1.5 rounded-full bg-[#06B6D4]"></span> -48dBm</span>
                                      <span class="text-[#94A3B8]">基线 -45dBm</span>
                                    </div>
                                  </div>
                                  <div class="h-20 w-full bg-[#FAFBFD] rounded border border-[#F1F5F9] p-1.5">
                                    <svg viewBox="0 0 200 50" class="w-full h-full overflow-visible">
                                      <line x1="0" y1="20" x2="200" y2="20" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3 2"/>
                                      <polyline fill="none" stroke="#06B6D4" stroke-width="1.8" points="0,22 40,24 80,32 100,44 120,38 160,28 200,24"/>
                                      <circle cx="0" cy="22" r="2" fill="#06B6D4"/><circle cx="40" cy="24" r="2" fill="#06B6D4"/><circle cx="80" cy="32" r="2" fill="#06B6D4"/><circle cx="100" cy="44" r="2.5" fill="#D9363E"/><circle cx="160" cy="28" r="2" fill="#06B6D4"/><circle cx="200" cy="24" r="2" fill="#06B6D4"/>

                          <template x-if="item.id !== 'seg_client_pop' && item.id !== 'node_pop' && item.id !== 'node_terminal'">
                            <div class="space-y-3">
                              <p class="text-xs text-[#5C6270] leading-relaxed" x-text="item.summary || ''"></p>
                              <div class="grid grid-cols-2 md:grid-cols-4 gap-2.5">
                                <template x-for="(m, mIdx) in (item.metrics || [])" :key="mIdx">

                                       :class="m.isAbnormal ? 'border-[#FEE2E2] bg-[#FFF8F8]' : 'border-[#E1E5EB]'">
                                    <div class="text-[11px] text-[#6F7785]" x-text="m.label"></div>
                                    <div class="text-xs font-medium font-mono mt-1"
                                         :class="m.isAbnormal ? 'text-[#D9363E]' : 'text-[#2F3540]'" x-text="m.value"></div>
                                    <template x-if="m.baseline">
                                      <div class="text-[10px] text-[#A1A7B3] mt-0.5" x-text="'基线: ' + m.baseline"></div>
                                    </template>
                                  </div>
                                </template>

                    </div>
                  </template>
                </div>

              </div>

            </div>

          </div>

        </main>

      </div>
    </template>
  </div>

  <script>
    (function injectUserDetailTemplate() {
      const tpl = document.getElementById('page-content-template');
      if (!tpl) return;
      ['atrust-workspace', 'sase-workspace'].forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.innerHTML = '';
          el.appendChild(tpl.content.cloneNode(true));
        }
      });
    })();
  </script>

</body>
