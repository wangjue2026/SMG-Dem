                <!-- 2. 右侧日期范围展示区 (点击直接唤出面板) -->
                <div class="h-full pl-3 pr-2.5 flex items-center justify-between cursor-pointer whitespace-nowrap hover:bg-[#F7F9FC] transition-colors"
                     @click="openDatePickerDirectly()">
                  <span class="font-mono text-xs text-[#2F3540] whitespace-nowrap" x-text="dateFilterState.rangeText"></span>
                  <svg class="w-3.5 h-3.5 text-[#A1A7B3] flex-shrink-0 ml-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                  </svg>
                </div>
              </div>

              <!-- ========================================== -->
              <!-- 快捷下拉菜单 (含 hover「自定义」级联右侧面板) -->
              <!-- ========================================== -->
              <div x-show="dateFilterState.shortcutDropdownOpen"
                   x-transition:enter="transition ease-out duration-100"
                   x-transition:enter-start="opacity-0 scale-95"
                   x-transition:enter-end="opacity-100 scale-100"
                   x-transition:leave="transition ease-in duration-75"
                   x-transition:leave-start="opacity-100 scale-100"
                   x-transition:leave-end="opacity-0 scale-95"
                   class="absolute top-9 left-0 z-50 bg-white border border-[#E2E8F0] rounded-[2px] shadow-lg py-1 min-w-[110px] text-xs"
                   style="display: none;">
                <template x-for="item in ['今天', '近24小时', '近3天', '近7天', '近30天']" :key="item">
                  <div @click="selectShortcut(item)"
                       @mouseenter="dateFilterState.hoverCustom = false"
                       class="px-3 py-1.5 cursor-pointer flex items-center justify-between transition-colors"
                       :class="dateFilterState.shortcut === item ? 'bg-[#E6F4FF] text-[#1C6EFF] font-medium' : 'text-[#2F3540] hover:bg-[#F8FAFC]'">
                    <span x-text="item"></span>
                    <svg x-show="dateFilterState.shortcut === item" class="w-3.5 h-3.5 text-[#1C6EFF]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                  </div>
                </template>

                <!-- 自定义项：hover 时在右侧级联展开日历面板 -->
                <div @mouseenter="dateFilterState.hoverCustom = true; initPickerTempDates()"
                     @click="dateFilterState.hoverCustom = true; initPickerTempDates()"
                     class="relative px-3 py-1.5 cursor-pointer flex items-center justify-between transition-colors border-t border-[#F1F5F9] mt-0.5"
                     :class="(dateFilterState.shortcut === '自定义' || dateFilterState.hoverCustom) ? 'bg-[#E6F4FF] text-[#1C6EFF] font-medium' : 'text-[#2F3540] hover:bg-[#F8FAFC]'">
                  <span>自定义</span>
                  <svg class="w-3 h-3 text-[#8C8C8C]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                  </svg>
                </div>
              </div>

              <!-- ========================================== -->
              <!-- 日期时间范围选择面板 (支持级联与直接唤出) -->
              <!-- ========================================== -->
              <div x-show="dateFilterState.pickerOpen || (dateFilterState.shortcutDropdownOpen && dateFilterState.hoverCustom)"
                   x-transition:enter="transition ease-out duration-150"
                   x-transition:enter-start="opacity-0 translate-y-1"
                   x-transition:enter-end="opacity-100 translate-y-0"
                   x-transition:leave="transition ease-in duration-100"
                   x-transition:leave-start="opacity-100 translate-y-0"
                   x-transition:leave-end="opacity-0 translate-y-1"
                   class="absolute top-9 right-0 z-50 bg-white border border-[#E2E8F0] rounded-[3px] shadow-xl p-3 text-xs w-[320px]"
                   style="display: none;">
                
                <!-- 日历头部导航 -->
                <div class="flex items-center justify-between pb-2 mb-2 border-b border-[#F1F5F9]">
                  <button type="button" @click.stop="prevMonth()" class="p-1 hover:bg-[#F1F5F9] rounded text-[#64748B] hover:text-[#1C6EFF] transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                  </button>
                  <span class="font-medium text-[#1E293B]" x-text="`${dateFilterState.currentYear}年 ${dateFilterState.currentMonth + 1}月`"></span>
                  <button type="button" @click.stop="nextMonth()" class="p-1 hover:bg-[#F1F5F9] rounded text-[#64748B] hover:text-[#1C6EFF] transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                  </button>
                </div>

                <!-- 星期表头 -->
                <div class="grid grid-cols-7 gap-1 text-center text-[11px] text-[#94A3B8] mb-1 font-medium">
                  <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
                </div>

                <!-- 日期格子 -->
                <div class="grid grid-cols-7 gap-y-1 text-center text-xs">
                  <template x-for="d in getCalendarDays(dateFilterState.currentYear, dateFilterState.currentMonth)" :key="d.dateStr">
                    <div class="h-7 flex items-center justify-center relative cursor-pointer group"
                         :class="{
                           'opacity-30 cursor-not-allowed pointer-events-none': isDateDisabled(d.dateStr),
                           'text-[#CBD5E1]': !d.isCurrentMonth,
                           'text-[#1E293B]': d.isCurrentMonth && !isDateStartOrEnd(d.dateStr),
                           'bg-[#E6F4FF]': isDateInRange(d.dateStr) && !isDateStartOrEnd(d.dateStr)
                         }"
                         @click.stop="handleDateClick(d.dateStr)"
                         @mouseenter="handleDateHover(d.dateStr)">
                        <!-- 起点/终点高亮背景圆 -->
                        <span class="w-6 h-6 flex items-center justify-center rounded-full text-xs font-medium transition-colors z-10"
                              :class="isDateStartOrEnd(d.dateStr) ? 'bg-[#1C6EFF] text-white font-bold shadow-xs' : 'group-hover:bg-[#F1F5F9]'"
                              x-text="d.day"></span>
                    </div>
                  </template>
                </div>

                <!-- 底部跨度提示与时间设置 (支持编辑修改时间) -->
                <div class="mt-3 pt-2.5 border-t border-[#F1F5F9] space-y-2.5">
                  <div class="flex items-center justify-between text-[11px] text-[#5C6270]">
                    <span class="text-[#64748B] font-medium">时间范围:</span>
                    <div class="flex items-center gap-1.5 font-mono">
                      <input type="text" 
                             x-model="dateFilterState.startTime" 
                             placeholder="00:00:00"
                             maxlength="8"
                             @click.stop
                             class="w-[68px] h-[22px] px-1 text-center font-mono text-[11px] border border-[#D3D7DE] rounded-[2px] focus:border-[#1C6EFF] focus:outline-none text-[#1E293B] bg-[#F8FAFC] focus:bg-white transition-colors" />
                      <span class="text-[#94A3B8]">-</span>
                      <input type="text" 
                             x-model="dateFilterState.endTime" 
                             placeholder="23:59:59"
                             maxlength="8"
                             @click.stop
                             class="w-[68px] h-[22px] px-1 text-center font-mono text-[11px] border border-[#D3D7DE] rounded-[2px] focus:border-[#1C6EFF] focus:outline-none text-[#1E293B] bg-[#F8FAFC] focus:bg-white transition-colors" />
                    </div>
                  </div>

                  <div class="flex items-center justify-between text-[11px]">
                    <span class="text-[#94A3B8]">最大跨度 30 天</span>
                    <div class="flex items-center gap-1.5">
                      <button type="button" @click.stop="closeAllDatePopups()" class="px-2 py-1 bg-[#F1F5F9] hover:bg-[#E2E8F0] text-[#64748B] rounded-[2px] transition-colors cursor-pointer">取消</button>
                      <button type="button" @click.stop="applyCustomDateRange()" class="px-2.5 py-1 bg-[#1C6EFF] hover:bg-[#0B57D0] text-white rounded-[2px] font-medium shadow-xs transition-colors cursor-pointer">确定</button>
                    </div>
                  </div>
                </div>

              </div>

            </div>

            <!-- 收起概览按钮 (参照应用详情样式与间距) -->
            <button @click="showUserOverview = !showUserOverview" 
                    class="h-8 px-2.5 text-xs bg-white border border-[#D3D7DE] rounded-[2px] text-[#2F3540] hover:border-[#1C6EFF] hover:text-[#1C6EFF] inline-flex items-center gap-1.5 transition-colors cursor-pointer select-none">
              <svg class="w-3.5 h-3.5 transition-transform duration-200" :class="!showUserOverview && 'rotate-180'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
              </svg>
              <span x-text="showUserOverview ? '收起概览' : '展开概览'"></span>
            </button>
          </div>
        </div>

        <!-- 主内容区域 (主视口容器，顶部概览可折叠，主体分为左侧 240px 应用列表与右侧独立滚动排障看板) -->
        <main class="flex-1 bg-[#EDF1F7] px-3 pt-2 pb-3 flex flex-col space-y-2 overflow-hidden relative min-h-0">

          <!-- 4.1 顶部用户/分支基本信息卡片 (完全对齐应用详情卡片规范与视觉 - 支持一键收起/展开) -->
          <div x-show="showUserOverview" x-collapse class="bg-white border border-[#E1E5EB] rounded-[2px] p-4 shadow-xs flex-shrink-0">
            <div class="flex flex-wrap lg:flex-nowrap items-center justify-between gap-4">
              
              <!-- 左一: 图标、名称、类型、部门/组织 -->
              <div class="flex items-center gap-3 shrink-0">
                <div class="w-10 h-10 rounded-full bg-[#1C6EFF] text-white flex items-center justify-center font-bold text-base shadow-xs shrink-0"
                     x-text="userAvatarText">
                </div>
                <div class="space-y-0.5">
                  <div class="flex items-center gap-2">
                    <h1 class="text-sm font-bold text-[#2F3540] whitespace-nowrap" x-text="userName"></h1>
                  </div>
                  <div class="text-xs text-[#8A92A1] whitespace-nowrap truncate max-w-[320px]" :title="userDept" x-text="userDept"></div>
                </div>
              </div>

              <!-- 分隔线 -->
              <div class="hidden lg:block w-[1px] h-9 bg-[#E1E5EB] shrink-0"></div>

              <!-- 左二: 访问体验 (右侧带 AI 互动入口：一键分析该对象整体体验) -->
              <div class="flex flex-col justify-center shrink-0 px-2 min-w-[132px]">
                <div class="text-xs text-[#8A92A1] mb-1 whitespace-nowrap">访问体验</div>
                <div class="flex items-center gap-2">
                  <span :class="overallExperience === '差' ? 'bg-[#FFF1F0] text-[#F52727] border-[#FFA39E]' : (overallExperience === '一般' ? 'bg-[#FFFBE6] text-[#FA8C16] border-[#FFE58F]' : 'bg-[#F6FFED] text-[#52C41A] border-[#B7EB8F]')"
                        class="px-2.5 py-0.5 text-xs font-semibold rounded-[2px] border inline-block text-center"
                        x-text="overallExperience"></span>

                  <!-- AI 分析入口：线性渐变描边星标 + AI 分析文字 -->
                  <button type="button"
                          @click="openAiChat()"
                          title="让 AI 分析该对象这段时间的整体访问体验"
                          class="group/ai relative inline-flex items-center gap-1.5 h-[24px] pl-2 pr-2.5 rounded-full border border-[#C7DFFF] bg-white hover:border-[#1C6EFF] hover:bg-[#F7FBFF] hover:shadow-[0_0_0_3px_rgba(28,110,255,0.08)] transition-all cursor-pointer shrink-0 select-none">
                    <svg class="w-4 h-4" viewBox="0 0 24 24">
                      <path d="M10.5 3.6l1.9 5.2 5.2 1.9-5.2 1.9-1.9 5.2-1.9-5.2-5.2-1.9 5.2-1.9 1.9-5.2z"
                            fill="url(#aiOpsSparkleGrad)" fill-opacity="0.16"
                            stroke="url(#aiOpsSparkleGrad)" stroke-width="1.8" stroke-linejoin="round"/>
                      <path d="M18.4 14.4l.9 2.3 2.3.9-2.3.9-.9 2.3-.9-2.3-2.3-.9 2.3-.9.9-2.3z"
                            fill="url(#aiOpsSparkleGrad)" fill-opacity="0.16"
                            stroke="url(#aiOpsSparkleGrad)" stroke-width="1.5" stroke-linejoin="round"/>
                    </svg>
                    <span class="text-[11px] font-semibold bg-gradient-to-r from-[#1C6EFF] to-[#0BA37F] bg-clip-text text-transparent whitespace-nowrap">AI 分析</span>
                  </button>
                </div>
              </div>

              <!-- 分隔线 -->
              <div class="hidden lg:block w-[1px] h-9 bg-[#E1E5EB] shrink-0"></div>

              <!-- 左三: 监测应用数 -->
              <div class="flex flex-col justify-center shrink-0">
                <div class="text-xs text-[#8A92A1] mb-1 whitespace-nowrap">监测应用数</div>
                <div class="flex items-center gap-3 text-xs">
                  <div class="flex items-center gap-1 font-bold text-[#2F3540] whitespace-nowrap">
                    <svg class="w-3.5 h-3.5 text-[#8A92A1]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
                    </svg>
                    <span x-text="totalApps + ' 个'"></span>
                  </div>
                  <span class="text-[#D3D7DE]">|</span>
                  <div class="flex items-center gap-1.5 whitespace-nowrap">
                    <span class="px-2 py-0.5 text-[11px] rounded bg-[#F1F5F9] text-[#475569] font-medium">正常: <span x-text="normalApps"></span></span>
                    <span class="px-2 py-0.5 text-[11px] rounded bg-[#F1F5F9] text-[#475569] font-medium">一般: <span x-text="fairApps"></span></span>
                    <span class="px-2 py-0.5 text-[11px] rounded bg-[#F1F5F9] text-[#475569] font-medium">差: <span x-text="poorApps"></span></span>
                  </div>
                </div>
              </div>

              <!-- 分隔线 -->
              <div class="hidden lg:block w-[1px] h-9 bg-[#E1E5EB] shrink-0"></div>

              <!-- 左四: 接入AF/终端 与 POP (根据 queryType 切换) -->
              <div class="flex flex-col justify-center shrink-0">
                <div class="text-xs text-[#8A92A1] mb-1 whitespace-nowrap" x-text="queryType === '分支' ? '接入 POP' : '接入终端 / POP'"></div>
                <div class="flex items-center gap-2 text-xs">
                  
                  <!-- 分支场景：仅展示接入 POP（不展示分支AF 与出口 IP） -->
                  <template x-if="queryType === '分支'">
                    <span class="px-2 py-0.5 text-[11px] rounded bg-[#F1F5F9] text-[#475569] font-medium whitespace-nowrap flex items-center gap-1">
                      <svg class="w-3 h-3 text-[#64748B]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                      </svg>
                      <span x-text="getUserPopsList()[0]?.name || userPop || 'POP'"></span>
                    </span>
                  </template>

                  <!-- 个人用户场景：支持单终端与多终端(+N及悬浮展开，无在线状态) -->
                  <template x-if="queryType !== '分支'">
                    <div class="relative group flex items-center gap-1.5 select-none">
                      <div class="font-medium text-[#2F3540] whitespace-nowrap flex items-center gap-1">
                        <template x-if="getUserTerminalsList()[0]?.type === 'mobile'">
                          <svg class="w-3.5 h-3.5 text-[#8A92A1]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                          </svg>
                        </template>
                        <template x-if="getUserTerminalsList()[0]?.type !== 'mobile'">
                          <svg class="w-3.5 h-3.5 text-[#8A92A1]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                          </svg>
                        </template>
                        <span class="max-w-[130px] truncate" x-text="getUserTerminalsList()[0]?.name || userTerminal || 'MacBook Pro'"></span>
                      </div>

                      <!-- 超过 1 台终端时展示 +N 徽标 -->
                      <template x-if="getUserTerminalsList().length > 1">
                        <span class="px-1.5 py-0.2 text-[10px] font-bold rounded bg-[#EFF6FF] text-[#1C6EFF] border border-[#BFDBFE] cursor-pointer"
                              x-text="'+' + (getUserTerminalsList().length - 1)"></span>
                      </template>

                      <!-- 悬浮 Tooltip 展开全部终端 (注：在线状态不用给出) -->
                      <template x-if="getUserTerminalsList().length > 1">
                        <div class="absolute top-full left-0 mt-1 hidden group-hover:block z-50 pointer-events-none">
                          <div class="bg-white border border-[#E2E8F0] rounded-[4px] shadow-lg p-2.5 min-w-[220px] text-left">
                            <div class="text-[11px] font-semibold text-[#2F3540] mb-2 flex items-center justify-between border-b border-[#F1F5F9] pb-1.5">
                              <span>接入终端列表</span>
                              <span class="text-[10px] text-[#94A3B8] font-normal" x-text="'共 ' + getUserTerminalsList().length + ' 台'"></span>
                            </div>
                            <div class="space-y-1.5">
                              <template x-for="(t, idx) in getUserTerminalsList()" :key="idx">
                                <div class="flex items-center justify-between text-xs py-1 px-1.5 rounded bg-[#F8FAFC]">
                                  <div class="flex items-center gap-1.5 truncate mr-2">
                                    <template x-if="t.type === 'mobile'">
                                      <svg class="w-3.5 h-3.5 text-[#64748B] shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                                    </template>
                                    <template x-if="t.type !== 'mobile'">
                                      <svg class="w-3.5 h-3.5 text-[#64748B] shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                                    </template>
                                    <span class="font-medium text-[#2F3540] truncate" x-text="t.name"></span>
                                  </div>
                                  <span class="text-[10px] text-[#94A3B8] whitespace-nowrap" x-text="t.network || ''"></span>
                                </div>
                              </template>
                            </div>
                          </div>
                        </div>
                      </template>
                    </div>
                  </template>

                  <span x-show="queryType !== '分支'" class="text-[#D3D7DE]">|</span>
                  <!-- 接入POP：支持多POP展示（首个POP + +N徽标 + 悬浮展开，与接入终端效果一致）；分支已在左侧展示，不再重复 -->
                  <div x-show="queryType !== '分支'" class="relative group flex items-center gap-1.5 select-none">
                    <!-- 首个 POP 标签 -->
                    <span class="px-2 py-0.5 text-[11px] rounded bg-[#F1F5F9] text-[#475569] font-medium whitespace-nowrap" x-text="noGaUser ? '-' : (getUserPopsList()[0]?.name || userPop || '北京POP')"></span>

                    <!-- 超过 1 个 POP 时展示 +N 徽标 -->
                    <template x-if="getUserPopsList().length > 1">
                      <span class="px-1.5 py-0.2 text-[10px] font-bold rounded bg-[#EFF6FF] text-[#1C6EFF] border border-[#BFDBFE] cursor-pointer"
                            x-text="'+' + (getUserPopsList().length - 1)"></span>
                    </template>

                    <!-- 悬浮 Tooltip 展开全部 POP 列表 -->
                    <template x-if="getUserPopsList().length > 1">
                      <div class="absolute top-full left-0 mt-1 hidden group-hover:block z-50 pointer-events-none">
                        <div class="bg-white border border-[#E2E8F0] rounded-[4px] shadow-lg p-2.5 min-w-[200px] text-left">
                          <div class="text-[11px] font-semibold text-[#2F3540] mb-2 flex items-center justify-between border-b border-[#F1F5F9] pb-1.5">
                            <span>接入POP列表</span>
                            <span class="text-[10px] text-[#94A3B8] font-normal" x-text="'共 ' + getUserPopsList().length + ' 个'"></span>
                          </div>
                          <div class="space-y-1.5">
                            <template x-for="(p, idx) in getUserPopsList()" :key="idx">
                              <div class="flex items-center justify-between text-xs py-1 px-1.5 rounded bg-[#F8FAFC]">
                                <div class="flex items-center gap-1.5 truncate mr-2">
                                  <svg class="w-3 h-3 text-[#64748B] shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064"></path></svg>
                                  <span class="font-medium text-[#2F3540] truncate" x-text="p.name"></span>
                                </div>
                                <span class="text-[10px] text-[#94A3B8] whitespace-nowrap" x-text="p.terminal || ''"></span>
                              </div>
                            </template>
                          </div>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </div>

            </div>
          </div>

          <!-- 4.2 左右两栏布局核心容器 -->
          <div class="flex-1 flex gap-3 min-h-0 overflow-hidden relative">

            <!-- 左侧收起状态下的固定占位小竖条 -->
            <div x-show="isLeftPanelCollapsed" 
                 x-cloak
                 class="w-8 min-w-[32px] bg-white border border-[#E1E5EB] rounded-[2px] flex flex-col items-center py-2 flex-shrink-0 shadow-xs select-none transition-all duration-300">
              <button @click="isLeftPanelCollapsed = false"
                      title="展开监测列表"
                      class="w-6 h-7 rounded flex items-center justify-center text-[#5C6270] hover:text-[#1C6EFF] hover:bg-[#F0F6FF] transition-colors cursor-pointer">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path>
                </svg>
              </button>
            </div>

            <!-- 左侧: 240px 应用监测列表 (支持筛选、搜索、轻量圆点标记) -->
            <div x-show="!isLeftPanelCollapsed"
                 class="w-[240px] min-w-[240px] bg-white border border-[#E1E5EB] rounded-[2px] flex flex-col flex-shrink-0 overflow-visible transition-all duration-300 shadow-xs select-none">
              
              <!-- 表头与筛选下拉框 + 向左收起图标按钮 -->
              <div class="p-2.5 border-b border-[#E1E5EB] flex flex-col gap-2 bg-[#F8FAFC]">
                <div class="flex items-center justify-between gap-1">
                  <!-- 左侧: 标题与状态筛选下拉框 (间距 8px) -->
                  <div class="flex items-center gap-2 min-w-0">
                    <div class="flex items-center gap-1.5 shrink-0">
                      <span class="w-1 h-3.5 bg-[#1C6EFF] rounded-full"></span>
                      <span class="text-xs font-semibold text-[#2F3540] whitespace-nowrap">应用监测列表</span>
                    </div>
                    
                    <!-- 体验筛选下拉框（多选；固定宽度避免挤压收起按钮） -->
                    <div class="relative shrink-0" @click.outside="appFilterPanelOpen = false">
                      <button type="button"
                              @click="appFilterPanelOpen = !appFilterPanelOpen"
                              class="w-[88px] h-6 px-1.5 text-[11px] bg-white border rounded-[2px] focus:outline-none cursor-pointer flex items-center justify-between gap-1 transition-colors"
                              :class="appFilterCount ? 'border-[#1C6EFF] text-[#1C6EFF]' : 'border-[#D3D7DE] text-[#2F3540] hover:border-[#1C6EFF]'">
                        <span class="truncate" x-text="appFilterLabel"></span>
                        <svg class="w-2.5 h-2.5 flex-shrink-0 transition-transform duration-150"
                             :class="appFilterPanelOpen ? 'rotate-180' : ''"
                             fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                      </button>

                      <!-- 筛选面板：访问体验多选 -->
                      <div x-show="appFilterPanelOpen"
                           x-cloak
                           class="absolute left-0 top-[26px] z-50 w-[160px] bg-white border border-[#E1E5EB] rounded-[2px] shadow-lg overflow-hidden">

                        <div class="px-2.5 pt-2 pb-1 text-[10px] text-[#94A3B8]">访问体验</div>
                        <template x-for="opt in [{ v: '差', label: '体验差' }, { v: '一般', label: '体验一般' }, { v: '正常', label: '体验正常' }]" :key="opt.v">
                          <button type="button" @click="toggleAppFilterExp(opt.v)"
                                  class="w-full px-2.5 py-1.5 flex items-center gap-2 text-[11px] text-left hover:bg-[#F8FAFC] transition-colors cursor-pointer">
                            <span class="w-3 h-3 rounded-[2px] border flex items-center justify-center flex-shrink-0"
                                  :class="appFilterExps.includes(opt.v) ? 'bg-[#1C6EFF] border-[#1C6EFF]' : 'border-[#D3D7DE] bg-white'">
                              <svg x-show="appFilterExps.includes(opt.v)" class="w-2 h-2 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                              </svg>
                            </span>
                            <span :class="appFilterExps.includes(opt.v) ? 'text-[#1C6EFF] font-medium' : 'text-[#2F3540]'" x-text="opt.label"></span>
                          </button>
                        </template>

                        <!-- 底部：已选统计与重置 -->
                        <div class="px-2.5 py-1.5 border-t border-[#F1F5F9] flex items-center justify-between text-[10px]">
                          <span class="text-[#94A3B8]" x-text="appFilterCount ? '已选 ' + appFilterCount + ' 项' : '未设置筛选'"></span>
                          <button type="button" @click="clearAppFilters()"
                                  class="text-[#1C6EFF] hover:underline cursor-pointer"
                                  :class="appFilterCount ? '' : 'opacity-40 pointer-events-none'">重置</button>
                        </div>
                      </div>
                    </div>
                  </div>

                  <!-- 右侧: 收起按钮 (双向折叠收起图标 <<) -->
                  <button @click="isLeftPanelCollapsed = true; $nextTick(() => measureDirectLink())"
                          title="向左收起监测列表"
                          class="w-5 h-5 rounded flex items-center justify-center text-[#5C6270] hover:text-[#1C6EFF] hover:bg-[#EFF6FF] transition-colors cursor-pointer shrink-0">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"></path>
                    </svg>
                  </button>
                </div>

                <!-- 搜索框 (搜索名称/地址) -->
                <div class="relative flex items-center">
                  <input type="text" 
                         x-model="appSearchQuery" 
                         placeholder="搜索名称/地址" 
                         class="w-full h-7 pl-2.5 pr-7 text-xs bg-white border border-[#D3D7DE] rounded-[2px] focus:outline-none focus:border-[#1C6EFF] text-[#2F3540] placeholder-[#A1A7B3] transition-colors" />
                  <svg class="w-3.5 h-3.5 text-[#A1A7B3] absolute right-2 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                  </svg>
                </div>
              </div>

              <!-- 应用列表：全部平铺展示（多终端场景也不以终端分组） -->
              <div class="flex-1 overflow-y-auto custom-scrollbar">
                <div class="divide-y divide-[#F0F2F5]">
                  <template x-for="app in filteredApps" :key="app.id">
                    <div class="p-2.5 cursor-pointer transition-colors select-none"
                         :class="activeAppId === app.id ? 'bg-[#F0F7FF] border-l-2 border-[#1C6EFF]' : 'hover:bg-[#F8FAFC] border-l-2 border-transparent'"
                         @click="selectApp(app); focusWorstTerminal(app)">

                      <!-- 第一行: 名称前面的状态点 + 应用名称 -->
                      <div class="flex items-center gap-1.5 overflow-hidden">
                        <span class="w-[5px] h-[5px] rounded-full shrink-0"
                              :class="getAppExperience(app) === '差' ? 'bg-[#F52727]' : (getAppExperience(app) === '一般' ? 'bg-[#FA721B]' : 'bg-[#12A679]')"></span>
                        <span class="text-xs font-medium truncate"
                              :class="activeAppId === app.id ? 'text-[#1C6EFF]' : 'text-[#2F3540]'"
                              x-text="app.name"></span>
                      </div>

                      <!-- 第二行: IP / 域名地址 -->
                      <div class="mt-1 pl-3.5 text-[11px] text-[#8A92A1] font-mono truncate"
                           :title="app.domain || ''"
                           x-text="app.domain ? app.domain.replace(/^https?:\/\//, '') : ''"></div>
                    </div>
                  </template>

                  <!-- 全部为空 -->
                  <div x-show="filteredApps.length === 0"
                       class="py-8 text-center text-xs text-[#8A92A1] flex flex-col items-center justify-center space-y-1">
                    <svg class="w-6 h-6 text-[#D3D7DE]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <span>未匹配到应用</span>
                  </div>
                </div>
              </div>

            </div>

            <!-- 右侧: 选中应用排障下钻看板 (纵向滚动容器) -->
            <div id="detail-scroll-panel" x-ref="detailScrollPanel" class="flex-1 min-w-0 flex flex-col space-y-3 overflow-y-auto custom-scrollbar">

          <!-- 4.3 下方全宽应用排障与下钻看板 (满宽展示时间线趋势图、多段拓扑与指标明细) -->
          <!-- 模块: 体验时间线 + 访问链路统一容器 -->
          <div class="bg-white border border-[#E1E5EB] p-4 rounded-none shadow-xs flex-shrink-0 flex flex-col space-y-4">
            
            <!-- 上半部: 体验时间线 (每 1 分钟探测一次) -->
            <div class="flex flex-col">
              <!-- 趋势图 Header: 标题与图例 (去切片化，去除底部分割线) -->
              <div class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-2">
                  <span class="text-xs font-semibold text-[#2F3540]">体验时间线</span>
                  <span class="text-[11px] text-[#6F7785]">（悬浮/点击图区可联动查看对应时刻的链路与拓扑）</span>
                </div>
                    <!-- 访问体验图例 (5px圆点) -->
                    <div class="flex items-center gap-4 text-[11px] text-[#5C6270]">
                      <span class="flex items-center gap-1.5">
                        <span class="w-[5px] h-[5px] rounded-full bg-[#12A679]"></span>
                        <span>正常</span>
                      </span>
                      <span class="flex items-center gap-1.5">
                        <span class="w-[5px] h-[5px] rounded-full bg-[#FA721B]"></span>
                        <span>一般</span>
                      </span>
                      <span class="flex items-center gap-1.5">
                        <span class="w-[5px] h-[5px] rounded-full bg-[#F52727]"></span>
                        <span>差</span>
                      </span>
                    </div>
                  </div>

                  <!-- 散点趋势图容器 -->
                  <div class="bg-[#F8FAFC] p-3 rounded-[2px] relative flex flex-col select-none border border-[#EAEEF4]">
                    
                    <!-- 图表主体容器 (SVG 趋势背景 + HTML 交互散点层 + Y轴文字 + 底轴时间刻度) -->
                    <div class="relative w-full h-[142px]">
                      
                      <!-- 1. SVG 趋势背景与三段浅色底色分界区域 -->
                      <svg class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 1000 142" preserveAspectRatio="none">
                        <!-- 正常区域 (Y: 6 ~ 42) 浅绿色底色 -->
                        <rect x="44" y="6" width="940" height="36" fill="#12A679" fill-opacity="0.06" rx="1"/>
                        <line x1="44" y1="42" x2="984" y2="42" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3"/>

                        <!-- 一般区域 (Y: 42 ~ 78) 浅橙色底色 -->
                        <rect x="44" y="42" width="940" height="36" fill="#FA721B" fill-opacity="0.05" rx="1"/>
                        <line x1="44" y1="78" x2="984" y2="78" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3"/>

                        <!-- 差区域 (Y: 78 ~ 114) 浅红色底色 -->
                        <rect x="44" y="78" width="940" height="36" fill="#F52727" fill-opacity="0.05" rx="1"/>
                        <line x1="44" y1="114" x2="984" y2="114" stroke="#CBD5E1" stroke-width="1"/>

                        <!-- 2. 常态探测连线 (与应用详情一致：绿色健康基线，仅异常时段单独标红) -->
                        <polyline :points="trendPolylinePoints" fill="none" stroke="#12A679" stroke-width="1.5" opacity="0.85"/>

                        <!-- 2.1 一般/差 时段彩色折线 (探测点不落点，用彩色线段标出劣化区间) -->
                        <path :d="fairSegmentPath" fill="none" stroke="#FA721B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
                        <path :d="poorSegmentPath" fill="none" stroke="#F52727" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
                      </svg>

                      <!-- 2. 左侧 Y 轴纯灰色文字刻度 (无背景色) -->
                      <div class="absolute left-1 top-[6px] h-[108px] w-9 flex flex-col justify-between pointer-events-none select-none text-[11px] text-[#6F7785]">
                        <div class="h-[36px] flex items-center justify-center">
                          <span>正常</span>
                        </div>
                        <div class="h-[36px] flex items-center justify-center">
                          <span>一般</span>
                        </div>
                        <div class="h-[36px] flex items-center justify-center">
                          <span>差</span>
                        </div>
                      </div>

                      <!-- 3. 垂直虚线标尺线 (贯穿选中点至底轴横坐标) -->
                      <template x-if="selectedPoint">
                        <div class="absolute top-[4px] h-[110px] pointer-events-none z-10 -translate-x-1/2 flex flex-col items-center"
                             :style="`left: ${(selectedPoint.x / 1000) * 100}%;`">
                          <!-- 标尺顶部倒三角指针 -->
                          <div class="w-0 h-0 border-x-4 border-x-transparent border-t-[5px] border-t-[#1C6EFF]"></div>
                          <!-- 标尺线 -->
                          <div class="w-0 flex-1 border-r-[1.5px] border-dashed border-[#1C6EFF]"></div>
                        </div>
                      </template>

                      <!-- 4. 探测点渲染层 (点位密集：连续异常段由红色劣化连线表达，仅段尾最新异常点 + 当前定位点 + 悬浮点落圆点) -->
                      <template x-for="(pt, idx) in samplePoints" :key="pt.id">
                        <template x-if="isAbnormalSegmentTail(idx) || idx === selectedSampleIdx || idx === hoveredSampleIdx">
                          <div class="absolute -translate-x-1/2 -translate-y-1/2 z-20 w-6 h-6 flex items-center justify-center pointer-events-none select-none"
                               :style="`left: ${(pt.x / 1000) * 100}%; top: ${(pt.y / 142) * 100}%;`">

                            <!-- 当前定位点：外圈高亮光环脉冲 -->
                            <template x-if="idx === selectedSampleIdx">
                              <div class="absolute w-4 h-4 rounded-full border-2 border-[#1C6EFF] animate-pulse"></div>
                            </template>

                            <!-- 差状态（段尾最新异常点）的警示微外环 -->
                            <template x-if="isAbnormalSegmentTail(idx) && idx !== selectedSampleIdx">
                              <div class="absolute w-3.5 h-3.5 rounded-full border border-[#F52727]/40"></div>
                            </template>

                            <!-- 实体彩色数据点 -->
                            <div class="rounded-full border-[1.5px] border-white shadow-xs transition-all duration-150"
                                 :class="{
                                   'w-2.5 h-2.5 ring-1 ring-black/10': idx !== selectedSampleIdx && idx !== hoveredSampleIdx,
                                   'w-3 h-3 ring-2 ring-[#1C6EFF]/50 shadow-sm': idx === selectedSampleIdx || idx === hoveredSampleIdx,
                                   'bg-[#12A679]': pt.experience === '正常',
                                   'bg-[#FA721B]': pt.experience === '一般',
                                   'bg-[#F52727]': pt.experience === '差'
                                 }">
                            </div>
                          </div>
                        </template>
                      </template>

                      <!-- 4.1 全幅悬浮/点击热区 (探测点密集，按鼠标横向位置就近吸附最近探测点) -->
                      <div class="absolute inset-0 z-30 cursor-crosshair"
                           @mousemove="handleTimelineHover($event)"
                           @mouseleave="hoveredSampleIdx = null; _pendingHoverIdx = null"
                           @click="selectTimelinePointAt($event)"></div>

                      <!-- 5. 悬浮 Tooltip (跟随鼠标 hover 的点定位) -->
                      <template x-if="hoveredPoint">
                        <div class="absolute -top-11 -translate-x-1/2 bg-[#1E293B] text-white text-[10px] px-2.5 py-1.5 rounded shadow-xl whitespace-nowrap z-40 pointer-events-none transition-all duration-75 border border-white/10 flex flex-col gap-0.5"
                             :style="`left: ${(hoveredPoint.x / 1000) * 100}%;`">
                          <div class="flex items-center gap-1.5 font-mono">
                            <span class="font-bold text-[11px]" x-text="hoveredPoint.time"></span>
                            <span class="px-1.5 py-0.2 rounded text-[9px] font-sans font-semibold"
                                  :class="hoveredPoint.experience === '差' ? 'bg-[#F52727]/30 text-rose-300' : (hoveredPoint.experience === '一般' ? 'bg-[#FA721B]/30 text-amber-300' : 'bg-[#12A679]/30 text-emerald-300')"
                                  x-text="hoveredPoint.experience"></span>
                          </div>
                          <div class="flex items-center gap-2 text-[#CBD5E1] text-[10px]">
                            <span>时延: <b class="text-white font-outfit" x-text="hoveredPoint.ttfb + 'ms'"></b></span>
                            <span>丢包率: <b class="text-white font-outfit" x-text="hoveredPoint.loss"></b></span>
                          </div>
                        </div>
                      </template>

                      <!-- 6. 底轴横坐标时间刻度 (精确对齐数据点 X 轴范围 48px ~ 976px) -->
                      <div class="absolute left-[4.8%] right-[2.4%] top-[120px] flex items-center justify-between text-[10px] text-[#6F7785] font-mono pointer-events-none select-none">
                        <template x-for="(label, axisIdx) in timelineAxisLabels" :key="axisIdx">
                          <span x-text="label"></span>
                        </template>
                      </div>

                    </div>
                  </div>
                </div>

                <!-- 上下虚线分割线 -->
                <div class="border-t border-dashed border-[#D3D7DE] my-1"></div>

                <!-- 下半部: 访问链路 + 链路明细 -->
                <div class="flex flex-col space-y-4">
                  
                  <!-- 访问链路 Header -->
                  <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                      <span class="text-xs font-semibold text-[#2F3540]">访问链路</span>
                      <span class="text-[11px] text-[#6F7785] font-normal" x-text="'（联动时刻 ' + (currentPoint?.time || currentSlice.time || '16:00') + '）'"></span>
                    </div>
                    <!-- 右侧：单探测端时展示端到端丢包与时延；多端探测时统一移到拓扑图下方按端展示 -->
                    <div class="flex items-center gap-2">
                      <div x-show="!hasMultipleTerminalsInCurrentSlice()"
                           class="flex items-center gap-2 py-0.5 px-2 rounded-[3px] bg-[#F8FAFC] border border-[#E2E8F0]" title="由各分段指标聚合得到的端到端体验数据">
                        <span class="text-[11px] text-[#6F7785] whitespace-nowrap">端到端体验</span>
                        <span class="text-[#E0E0E0]">|</span>
                        <span class="text-xs text-[#6F7785] font-sans whitespace-nowrap">时延:</span>
                        <span class="text-xs font-bold font-mono font-outfit"
                              :class="currentPoint?.experience === '差' ? 'text-[#F52727]' : 'text-[#2F3540]'"
                              x-text="endToEndMetrics.delay"></span>
                        <span class="text-[#E0E0E0]">|</span>
                        <span class="text-xs text-[#6F7785] font-sans whitespace-nowrap">丢包:</span>
                        <span class="text-xs font-bold font-mono font-outfit"
                              :class="currentPoint?.experience === '差' ? 'text-[#F52727]' : 'text-[#2F3540]'"
                              x-text="endToEndMetrics.loss"></span>
                      </div>

                      <!-- 判定规则入口：右上角问号，悬浮即显示口径说明 -->
                      <div class="relative group/rule">
                        <button type="button"
                                class="w-5 h-5 rounded-full border border-[#D3D7DE] text-[#6F7785] group-hover/rule:border-[#1C6EFF] group-hover/rule:text-[#1C6EFF] flex items-center justify-center transition-colors cursor-help"
                                title="判定规则">
                          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                          </svg>
                        </button>
                        <div class="absolute right-0 top-full pt-1.5 hidden group-hover/rule:block z-[80]">
                          <div class="w-[300px] bg-white border border-[#E2E8F0] rounded-[4px] shadow-xl p-3 text-left">
                            <div class="flex items-center gap-1.5 pb-2 border-b border-[#F1F5F9] mb-2">
                              <span class="w-1.5 h-3.5 bg-[#1C6EFF] rounded-full"></span>
                              <span class="text-xs font-semibold text-[#2F3540]">判定规则</span>
                            </div>
                            <div class="space-y-2 text-[11px] text-[#475569] leading-relaxed">
                              <div class="flex items-start gap-1.5">
                                <span class="mt-[5px] w-1 h-1 rounded-full bg-[#94A3B8] shrink-0"></span>
                                <span>链路状态只看时延和丢包，任一项超出基线就会降级</span>
                              </div>
                              <div class="flex items-start gap-1.5">
                                <span class="mt-[5px] w-1 h-1 rounded-full bg-[#94A3B8] shrink-0"></span>
                                <span>各分段指标由端到端结果分摊而来，分段相加约等于端到端</span>
                              </div>
                              <div class="flex items-start gap-1.5">
                                <span class="mt-[5px] w-1 h-1 rounded-full bg-[#94A3B8] shrink-0"></span>
                                <span>终端、分支AF、总部AF、代理网关为中性蓝节点，应用为中性灰节点，都只代表链路位置、不代表健康；只有全球加速骨干网按时延与丢包着色</span>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>

                  </div>

                  <!-- 拓扑图表 -->
                  <div class="bg-[#F8FAFC] rounded-[2px] border border-[#EAEEF4] flex flex-col relative overflow-visible">

                    <!-- 多终端切换胶囊栏 (仅当当前切片有多终端访问时展示) -->
                    <template x-if="hasMultipleTerminalsInCurrentSlice()">

                      </svg>
                    </div>
                    <div class="bg-white border border-[#E2E8F0] rounded-[8px] px-4 py-3.5 shadow-xs min-w-0 flex-1">
                      <p class="text-[14px] text-[#1E293B] font-bold leading-relaxed" x-text="aiChatAnswer.conclusion"></p>

                      <div class="mt-2 space-y-1.5 text-[11px] text-[#334155] leading-relaxed">
                        <div class="flex items-start gap-1.5">
                          <span class="text-[#94A3B8] shrink-0">•</span>
                          <div><span class="text-[#64748B]">问题时段：</span><span x-text="aiChatAnswer.periodDesc"></span></div>
                        </div>
                        <div class="flex items-start gap-1.5">
                          <span class="text-[#94A3B8] shrink-0">•</span>
                          <div><span class="text-[#64748B]">涉及应用：</span><span x-text="aiChatAnswer.appsDesc"></span></div>
                        </div>
                        <div class="flex items-start gap-1.5">
                          <span class="text-[#94A3B8] shrink-0">•</span>
                          <div class="min-w-0">
                            <span class="text-[#F52727] font-medium">异常分段：</span>
                            <template x-if="aiChatAnswer.segmentItems && aiChatAnswer.segmentItems.length > 0">
                              <div class="mt-0.5 space-y-0.5">
                                <template x-for="(seg, sIdx) in aiChatAnswer.segmentItems" :key="'ai-seg-' + sIdx">
                                  <div class="text-[#F52727]">
                                    <span class="font-medium" x-text="seg.name"></span>
                                    <span class="text-[#64748B]">：受影响应用 <span x-text="seg.apps.join(' / ')"></span>（<span x-text="seg.apps.length"></span> 个）</span>
                                  </div>
                                </template>
                              </div>
                            </template>
                            <span x-show="!aiChatAnswer.segmentItems || aiChatAnswer.segmentItems.length === 0">暂未定位到明确异常分段</span>
                          </div>
                        </div>
                        <div class="flex items-start gap-1.5">
                          <span class="text-[#94A3B8] shrink-0">•</span>
                          <div><span class="text-[#64748B]">责任域：</span><span x-text="aiChatAnswer.domainDesc"></span></div>
                        </div>
                        <div class="flex items-start gap-1.5">
                          <span class="text-[#94A3B8] shrink-0">•</span>
                          <div class="flex items-start gap-1.5 flex-wrap min-w-0">
                            <span class="text-[#64748B]">影响范围：</span>
                            <span class="inline-flex items-center h-[18px] px-1.5 rounded-[2px] border text-[11px] font-medium shrink-0"
                                  :class="aiChatAnswer.impactTagClass"
                                  x-text="aiChatAnswer.impactTag"></span>
                            <span class="min-w-0" x-text="aiChatAnswer.impactDetail"></span>
                          </div>
                        </div>
                        <div class="flex items-start gap-1.5">
                          <span class="text-[#94A3B8] shrink-0">•</span>
                          <div>
                            <span class="text-[#64748B]">建议查看的时段：</span>
                            <template x-if="aiChatAnswer.suggestedRange">
                              <button type="button" @click="applyInsightTimeRange()"
                                      class="text-[#1C6EFF] hover:underline font-medium cursor-pointer"
                                      x-text="aiChatAnswer.suggestedRange"></button>
                            </template>
                            <span x-show="!aiChatAnswer.suggestedRange">当前无劣化时段</span>
                          </div>
                        </div>
                      </div>

                      <div class="mt-2.5 pt-2 border-t border-[#F1F5F9] text-[10px] text-[#8A92A1] leading-relaxed">
                        以上为系统基于统计时段内探测数据自动生成的推断，存在不确定性，不构成最终定责结论。
                      </div>
                    </div>
                  </div>
                </template>

              </div>

              <!-- 底部只读提示：仅触发式，不支持自由输入 -->
              <div class="h-[44px] min-h-[44px] px-6 border-t border-[#F0F2F5] flex items-center gap-2 flex-shrink-0 bg-white">
                <svg class="w-3 h-3 text-[#A1A7B3] shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
                <span class="text-[11px] text-[#8A92A1]">当前仅支持触发式分析，暂不支持自由输入</span>
                <button type="button" @click="runAiChatAnalysis()"
                        class="ml-auto text-[11px] text-[#1C6EFF] hover:underline cursor-pointer">重新分析</button>
              </div>

            </div>
          </div>
        </div>

      </div>
    </template>
  </div>

  <script>
    (function injectUserDetailTemplate() {
      const tpl = document.getElementById('page-content-template');
      if (!tpl) return;
      ['atrust-workspace', 'sase-workspace'].forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.innerHTML = '';
          el.appendChild(tpl.content.cloneNode(true));
        }
      });
    })();
  </script>

</body>
</html>
