<!-- [PROJECT META] 方案类型：方案二 (一期方案) | 路径：Demos/02-方案二(一期)/DEM-排障定位.html -->
<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>【方案二-一期】DEM - 排障定位 - 线上线下双底座</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <script src="../assets/js/ai-dem-data.js"></script>
  <link rel="stylesheet" href="../assets/css/ai-dem.css" />

  <!-- 方案二公共底座样式 -->
  <link rel="stylesheet" href="./_shell/shell.css" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ["Inter", "PingFang SC", "sans-serif"], outfit: ["Outfit", "sans-serif"] },
          colors: {
            brand: { DEFAULT: "var(--color-blue, #1C6EFF)", hover: "#387EFF", active: "#0056EB" },
            text: { DEFAULT: "var(--color-graphite-d40, #272E38)", title: "var(--color-graphite-d30, #454C59)", mute: "var(--color-graphite, #A1A7B3)" },
            border: "var(--color-graphite-l20, #C0C8D6)",
            bg: { light: "var(--color-graphite-l50, #F4F6F9)", line: "var(--color-graphite-l30, #E1E5EB)" }
          }
        }
      }
    }
  </script>
</head>

<body class="bg-bg-light text-text font-sans overflow-hidden w-screen h-screen">

  <div class="flex flex-col w-full h-full" x-data="dualShellAppStore('排障定位')">

    <div id="shell-switcher"></div>

    <!-- aTrust 框架 -->
    <div x-show="shell === 'atrust'" class="flex flex-col w-full h-full">
      <div id="shell-atrust-header"></div>
      <div class="flex-1 flex overflow-hidden">
        <div id="shell-atrust-sider"></div>
        <div class="flex-1 bg-bg-light flex flex-col overflow-hidden">
          <div class="flex-1 bg-[#F4F6F9] flex flex-col overflow-hidden" id="atrust-workspace"></div>
        </div>
      </div>
    </div>

    <!-- SASE 框架 -->
    <div x-show="shell === 'sase'" class="flex w-full h-full overflow-hidden">
      <div id="shell-sase-sider"></div>
      <div class="flex-1 bg-bg-light flex flex-col overflow-hidden">
        <div class="flex-1 bg-[#F4F6F9] flex flex-col overflow-hidden" id="sase-workspace"></div>
      </div>
    </div>

    <!-- 排障定位 Workspace 内容模板 -->
    <template id="page-content-template">
      <div class="flex flex-col w-full h-full overflow-hidden">

        <!-- 页头 -->
        <div class="h-[48px] min-h-[48px] max-h-[48px] bg-white border-b border-[#E2E8F0] px-6 flex items-center justify-between flex-shrink-0 select-none z-20">

          <!-- 未下钻：Tab 页头 -->
          <div x-show="!showDetailedReport" class="flex items-center justify-between w-full h-full">
            <div class="flex items-center h-full">
              <span class="text-[14px] font-semibold text-[#1E293B]">体验监控</span>
              <div class="w-[1px] h-[16px] mx-[16px] bg-[#E1E5EB]"></div>
              <div class="flex items-center h-full gap-6 relative">
                <!-- Tab: 体验预警（跳转） -->
                <div class="relative h-full flex items-center cursor-pointer select-none group" @click="navigateTo('体验预警')">
                  <span class="text-[14px] text-[#2F3540] font-normal group-hover:text-[#1C6EFF]">体验预警</span>
                </div>
                <!-- Tab: 排障定位（当前页） -->
                <div class="relative h-full flex items-center cursor-pointer select-none">
                  <span class="text-[14px] text-[#1C6EFF] font-semibold">排障定位</span>
                  <div class="absolute bottom-0 left-0 right-0 h-[2px] bg-[#1C6EFF]"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- 下钻页头（无面包屑，去掉时间与关闭按钮） -->
          <div x-show="showDetailedReport" class="flex items-center justify-between w-full h-full" x-cloak>
            <div class="flex items-center gap-2 text-xs">
              <button @click="showDetailedReport = false" class="hover:bg-slate-100 p-1.5 rounded text-[#5E6573] hover:text-[#1C6EFF] transition-colors flex items-center gap-1 font-medium cursor-pointer" title="返回">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"></path></svg>
              </button>
              <span class="text-[#1E293B] font-bold text-sm">详细排障分析报告</span>
            </div>
            <div class="flex items-center gap-2">
              <button @click="window.print()" class="h-7 px-3 bg-white border border-[#D3D7DE] hover:border-[#1C6EFF] hover:text-[#1C6EFF] text-[#334155] rounded-[2px] text-xs font-medium inline-flex items-center gap-1.5 transition-colors cursor-pointer shadow-2xs">
                <svg class="w-3.5 h-3.5 text-[#5E6573]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                <span>导出 PDF 报告</span>
              </button>
            </div>
          </div>
        </div>

        <!-- 排障定位主体滚动区 -->
        <div class="flex-1 px-4 py-2 flex flex-col gap-2 overflow-y-auto custom-scrollbar">

          <!-- View 1: 排障定位主视图 -->
          <div x-show="!showDetailedReport" class="flex flex-col gap-2 w-full">

            <!-- AI 排障输入面板 -->
            <div class="bg-white border border-[#E2E8F0] p-4 rounded-[4px] shadow-2xs flex flex-col gap-2.5">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-2 text-xs font-semibold text-[#1E293B]">
                  <div class="w-5 h-5 rounded bg-brand text-white flex items-center justify-center font-bold text-[10px]">AI</div>
                  <span>体验现象智能分析与排障</span>
                </div>
                <div class="flex items-center gap-2 select-none">
                  <!-- 日期选择器 -->
                  <div class="inline-flex items-center h-7 bg-white border border-[#D3D7DE] rounded-[2px] hover:border-[#1C6EFF] transition-colors text-xs">
                    <div class="relative bg-[#F7F9FC] h-full px-2 flex items-center justify-between border-r border-[#D3D7DE] min-w-[76px] cursor-pointer group">
                      <select x-model="troubleshootDateShortcut" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full text-xs">
                        <option value="今天">今天</option>
                        <option value="近24小时">近24小时</option>
                        <option value="近3天">近3天</option>
                        <option value="近7天">近7天</option>
                        <option value="近30天">近30天</option>
                      </select>
                      <span class="text-[#2F3540] font-normal text-xs" x-text="troubleshootDateShortcut"></span>
                      <svg class="w-3.5 h-3.5 text-[#A1A7B3] ml-1 group-hover:text-[#1C6EFF] transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                    <div class="h-full px-2 flex items-center justify-between cursor-pointer whitespace-nowrap">
                      <span class="font-mono text-[11px] text-[#5E6573]" x-text="troubleshootDateRange"></span>
                      <svg class="w-3.5 h-3.5 text-[#A1A7B3] flex-shrink-0 ml-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    </div>
                  </div>

                  <!-- 查看排障历史 -->
                  <button @click="showHistoryDrawer = true" class="h-7 px-2.5 bg-[#F1F5F9] hover:bg-[#E2E8F0] border border-[#CBD5E1] rounded-[2px] text-xs text-[#334155] font-medium inline-flex items-center gap-1.5 transition-colors cursor-pointer">
                    <svg class="w-3.5 h-3.5 text-[#64748B]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span>排障历史</span>
                    <span class="w-4 h-4 rounded-full bg-[#E2E8F0] text-[#64748B] text-[9px] font-bold font-mono inline-flex items-center justify-center" x-text="troubleshootHistory.length"></span>
                  </button>
                </div>
              </div>

              <!-- 自然语言输入区 (根据批注：背景白色，描边颜色使用开始分析按钮的蓝色 #1C6EFF) -->
              <div class="relative">
                <textarea x-model="troubleshootInput"
                          @focus="onTroubleshootFocus()"
                          @blur="onTroubleshootBlur()"
                          @input="agentWarningMessage = ''"
                          rows="3"
                          class="w-full p-3 pr-28 text-xs bg-white border border-[#1C6EFF] rounded-[4px] min-h-[82px] focus:outline-none focus:border-[#1C6EFF] focus:ring-1 focus:ring-[#1C6EFF]/20 transition-all resize-none leading-relaxed shadow-2xs"
                          :class="(troubleshootInput && (troubleshootInput.startsWith('1.') || troubleshootInput.startsWith('示例：'))) ? 'text-[#64748B]' : 'text-[#1E293B]'"></textarea>

                <button @click="startTroubleshootAnalysis()"
                        :disabled="isAnalyzing"
                        class="absolute right-2.5 bottom-3.5 h-8 px-4 bg-[#1C6EFF] hover:bg-[#0056EB] disabled:opacity-50 text-white rounded-[3px] text-xs font-medium transition-all shadow-xs flex items-center gap-1.5 cursor-pointer">
                  <div x-show="!isAnalyzing" class="flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    <span>开始分析</span>
                  </div>
                  <div x-show="isAnalyzing" class="flex items-center gap-1.5" x-cloak>
                    <svg class="w-3.5 h-3.5 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    <span>分析中...</span>
                  </div>
                </button>
              </div>

              <!-- Agent 拦截提示 -->
              <div x-show="agentWarningMessage" x-transition class="flex items-center gap-1.5 text-xs text-[#D97706] bg-[#FEF3C7] border border-[#FCD34D] px-3 py-1.5 rounded-[3px] select-none" x-cloak>
                <svg class="w-4 h-4 text-[#D97706] flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                <span class="font-medium" x-text="agentWarningMessage"></span>
              </div>

              <!-- Prompt 案例快捷输入 -->
              <div class="flex items-center gap-2 overflow-x-auto whitespace-nowrap custom-scrollbar flex-nowrap text-xs select-none py-0.5">
                <button @click="troubleshootInput = '今天 14:20，研发中心 VIP 用户张伟 (zhangwei) 反馈在访问 Harbor 镜像仓库拉取基础镜像时，出现频繁连接超时与 4.2% 的丢包卡顿现象'; agentWarningMessage = '';" class="px-2.5 py-1 bg-[#F1F5F9] hover:bg-[#E2E8F0] text-[#334155] rounded-[3px] text-[11px] transition-colors border border-[#E2E8F0] whitespace-nowrap flex-shrink-0">
                  案例 1 - 个体报障：用户张伟访问 Harbor 镜像仓库超时丢包
                </button>
                <button @click="troubleshootInput = '2026-06-04 13:45，上海分公司与苏州研发办多名员工均反馈访问内网 GitLab 提交代码与销售 CRM 构建迟钝'; agentWarningMessage = '';" class="px-2.5 py-1 bg-[#F1F5F9] hover:bg-[#E2E8F0] text-[#334155] rounded-[3px] text-[11px] transition-colors border border-[#E2E8F0] whitespace-nowrap flex-shrink-0">
                  案例 2 - 群体报障：上海分公司与苏州办员工反馈访问 GitLab/CRM 均卡慢
                </button>
                <button @click="troubleshootInput = '今天 10:00，Digiplus 马尼拉办公室 Maria 及多名员工反馈飞书打开文档与上传附件很慢，Office 365 打开文件也很慢'; agentWarningMessage = '';" class="px-2.5 py-1 bg-[#F1F5F9] hover:bg-[#E2E8F0] text-[#334155] rounded-[3px] text-[11px] transition-colors border border-[#E2E8F0] whitespace-nowrap flex-shrink-0">
                  案例 3 - 移动 SWG 报障：马尼拉办公室 Maria 及多名员工反馈飞书与 Office 365 访问卡慢
                </button>
              </div>

              <!-- AI 分析 Loading -->
              <div x-show="isAnalyzing" class="mt-1 bg-gradient-to-r from-blue-50/70 via-indigo-50/50 to-slate-50 border border-blue-200/80 p-4 rounded-[4px] space-y-3" x-cloak>
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-2 text-xs font-semibold text-[#1C6EFF]">
                    <svg class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    <span>DEM AI 排障引擎正在计算五段拓扑链路与调取端探针数据...</span>
                  </div>
                  <span class="text-[11px] font-mono text-[#1C6EFF] font-semibold" x-text="`${analysisStep * 33}%`"></span>
                </div>
                <div class="grid grid-cols-3 gap-2">
                  <div class="h-1.5 rounded-full overflow-hidden bg-slate-200"><div class="h-full bg-[#1C6EFF] transition-all duration-300" :style="analysisStep >= 1 ? 'width: 100%' : 'width: 0%'"></div></div>
                  <div class="h-1.5 rounded-full overflow-hidden bg-slate-200"><div class="h-full bg-[#1C6EFF] transition-all duration-300" :style="analysisStep >= 2 ? 'width: 100%' : 'width: 0%'"></div></div>
                  <div class="h-1.5 rounded-full overflow-hidden bg-slate-200"><div class="h-full bg-[#1C6EFF] transition-all duration-300" :style="analysisStep >= 3 ? 'width: 100%' : 'width: 0%'"></div></div>
                </div>
                <div class="text-[11px] text-[#475569] font-mono space-y-1">
                  <div x-show="analysisStep >= 1" class="flex items-center gap-1.5 text-emerald-700">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    <span>[Step 1] 已拉取终端客户端拨测日志与出口 SD-WAN 节点性能指标...</span>
                  </div>
                  <div x-show="analysisStep >= 2" class="flex items-center gap-1.5 text-emerald-700">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    <span>[Step 2] 关联运营商跨网 POP 选路路由，碰撞出 14.2% 大包丢包瓶颈...</span>
                  </div>
                  <div x-show="analysisStep >= 3" class="flex items-center gap-1.5 text-blue-700 font-semibold">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    <span>[Step 3] AI 智能根因结论生成完毕。</span>
                  </div>
                </div>
              </div>

              <!-- 分析摘要卡片 (精简单横向卡片：按 1.总结定性 2.问题定位 3.影响范围 4.处置建议 顺序排列，仅保留重点红框内容) -->
              <div x-show="analysisResult" class="mt-1 bg-[#F4F8FF] border border-[#BFDBFE] p-4 rounded-[4px] shadow-2xs space-y-3" x-cloak>
                <div class="flex items-center justify-between pb-2 border-b border-blue-100">
                  <span class="text-xs font-bold text-[#1E293B]" x-text="analysisResult?.title || '针对【今天10:00，Digiplus 马尼拉办公室 Maria 及...】问题分析摘要：'"></span>
                  <div class="flex items-center gap-2">
                    <button @click="openDetailedReport()" class="px-3 py-1 bg-white hover:bg-blue-50 text-[#1C6EFF] border border-[#1C6EFF] rounded-[2px] text-xs font-medium inline-flex items-center gap-1 transition-colors cursor-pointer shadow-2xs">
                      <span>查看排障详情</span>
                    </button>
                    <button @click="analysisResult = null" class="px-3 py-1 bg-white hover:bg-slate-50 text-[#5E6573] border border-[#D3D7DE] rounded-[2px] text-xs font-medium transition-colors cursor-pointer">
                      <span>关闭</span>
                    </button>
                  </div>
                </div>

                <!-- 单横向卡片：按顺序排列所有摘要信息 -->
                <div class="bg-white p-3.5 rounded border border-blue-100/80 shadow-2xs text-xs text-slate-800 space-y-3">
                  <!-- 总结定性 -->
                  <div class="flex items-start gap-3 pb-2.5 border-b border-slate-100">
                    <div class="w-24 shrink-0 pt-0.5">
                      <span class="font-bold text-slate-900 text-[12px]">总结定性</span>
                    </div>
                    <div class="flex-1 text-[11px] text-slate-900 leading-relaxed pt-0.5">
                      <p class="font-bold text-[14px]">本次反馈访问体验差是真实存在问题，主要是由于客户端到POP隧道质量下降与SASE平台租户限流双重因素造成了用户感受卡慢。</p>
                      <div class="flex items-center gap-1.5 mt-2">
                        <span class="px-1.5 py-0.5 bg-rose-50 text-rose-600 text-[10px] rounded border border-rose-100 shrink-0">群体问题</span>
                        <span class="px-1.5 py-0.5 bg-pink-50 text-pink-600 text-[10px] rounded border border-pink-100 truncate shrink-0 max-w-[140px]" title="客户端隧道与平台限流">客户端隧道与平台限流</span>
                      </div>
                    </div>
                  </div>

                  <!-- 问题定位 -->
                  <div class="flex items-start gap-3 pb-2.5 border-b border-slate-100">
                    <div class="w-24 shrink-0 pt-0.5">
                      <span class="font-bold text-slate-900 text-[12px]">问题定位</span>
                    </div>
                    <div class="flex-1 text-[11px] font-normal space-y-1">
                      <div><span class="text-[#64748B]">异常点：</span><span class="text-slate-900" x-text="analysisResult?.location?.bottleneck || '客户端到POP分段异常（段异常：私网Hop2）与 POP节点处理异常（点异常：10G限流）'"></span></div>
                      <div><span class="text-[#64748B]">异常特征：</span><span class="font-mono text-[#D9363E] font-medium" x-text="analysisResult?.location?.metrics || 'Underlay丢包3.1%/抖动40ms; Overlay吞吐20M; POP流量10.4G命中限流'"></span></div>
                    </div>
                  </div>

                  <!-- 影响范围 -->
                  <div class="flex items-start gap-3 pb-2.5 border-b border-slate-100">
                    <div class="w-24 shrink-0 pt-0.5">
                      <span class="font-bold text-slate-900 text-[12px]">影响范围</span>
                    </div>
                    <div class="flex-1 text-[11px] font-normal space-y-1">
                      <div><span class="text-[#64748B]">受影响用户：</span><span class="text-slate-900" x-text="analysisResult?.impact?.affectedUsers || 'Maria 及马尼拉办公室出口 203.177.12.8 下 34 名用户 (占 73.9%)'"></span></div>
                      <div><span class="text-[#64748B]">受影响分支：</span><span class="text-slate-900" x-text="analysisResult?.impact?.affectedBranches || '马尼拉办公室 (出口 IP 203.177.12.8)'"></span></div>
                      <div><span class="text-[#64748B]">受影响应用：</span><span class="text-slate-900" x-text="analysisResult?.impact?.affectedApps || '飞书、Office 365 (SaaS 办公系统)'"></span></div>
                    </div>
                  </div>

                  <!-- 处置建议 -->
                  <div class="flex items-start gap-3">
                    <div class="w-24 shrink-0 pt-0.5">

  <!-- 排障定位专属逻辑 -->
  <script>
    // 同步初始化模板节点
    (function injectTroubleshootTemplate() {
      const tpl = document.getElementById('page-content-template');
      if (!tpl) return;
      ['atrust-workspace', 'sase-workspace'].forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.innerHTML = '';
          el.appendChild(tpl.content.cloneNode(true));
        }
      });
    })();

    window.dualShellAppStore = function (activePage) {
      function safeGet(key, def) {
        try { const v = localStorage.getItem(key); return v !== null ? v : def; } catch(e) { return def; }
      }
      function safeSet(key, val) {
        try { localStorage.setItem(key, val); } catch(e) {}
      }

      const defaultTroubleshootText = `1. 请输入排障现象，请尽量包含访问主体（用户/分支等）、受影响应用及异常表现。若未指定时间，系统默认按【今天】时间范围进行分析。\n2. 示例：今天 14:20，研发中心 VIP 用户张伟 (zhangwei) 反馈在访问 Harbor 镜像仓库拉取基础镜像时，出现频繁连接超时与 4.2% 的丢包卡顿现象`;

      return {
        // ── 底座公共属性 ──
        shell: safeGet('demoShell_v2', 'atrust'),
        activePage: activePage || '排障定位',
        atrustExpandedL2: 'dem',
        saseExpandedL1Keys: ['dem-monitoring'],

        setShell(s) { this.shell = s; safeSet('demoShell_v2', s); },
        navigateTo(page) { const url = window.DEM_ROUTES_V2?.[page]; if (url) window.location.href = url; },
        toggleAtrustL2(key) { this.atrustExpandedL2 = this.atrustExpandedL2 === key ? '' : key; },
        toggleSaseL1(key) { this.saseExpandedL1Keys.includes(key) ? (this.saseExpandedL1Keys = this.saseExpandedL1Keys.filter(k => k !== key)) : this.saseExpandedL1Keys.push(key); },
        isSaseExpanded(key) { return this.saseExpandedL1Keys.includes(key); },

        // ── 子 Tab 数据 ──
        branches: [], users: [], apps: [],
        branchRegion: 'all', branchExp: 'all', branchSearch: '', branchPage: 1, branchPageSize: 10,
        userExp: 'all', userSearch: '', userPage: 1, userPageSize: 10,
        appType: 'all', appExp: 'all', appSearch: '', appPage: 1, appPageSize: 10,
        troubleshootSubTab: 'branch',

        // ── 排障 AI ──
        troubleshootDateShortcut: '今天',
        troubleshootDateRange: '2026-06-04 00:00:00 ~ 2026-06-04 23:59:59',
        defaultTroubleshootText: defaultTroubleshootText,
        _troubleshootInput: null,
        isAnalyzing: false, analysisStep: 0, analysisResult: null,
        agentWarningMessage: '',
        showDetailedReport: false,
        isSummaryCollapsed: false,
        detailReportTab: 'user',
        activeReportTab: 'user',
        activeAnchor: 'impact-user',
        isImpactExpanded: true,
        isTroubleshootExpanded: true,
        showHistoryDrawer: false, historySearchQuery: '',

        scrollToAnchor(id) {
          this.activeAnchor = id;
          if (id.startsWith('impact')) {
            this.isImpactExpanded = true;
          } else if (id.startsWith('loc')) {
            this.isTroubleshootExpanded = true;
          }
          this.$nextTick(() => {
            const el = document.getElementById(`sec-${id}`);
            if (el) {
              const scrollParent = el.closest('.overflow-y-auto') || document.documentElement;
              if (scrollParent === document.documentElement || scrollParent === document.body) {
                el.scrollIntoView({ behavior: 'smooth', block: 'start' });
              } else {
                const parentRect = scrollParent.getBoundingClientRect();
                const elRect = el.getBoundingClientRect();
                const targetScrollTop = scrollParent.scrollTop + (elRect.top - parentRect.top) - 12;
                scrollParent.scrollTo({ top: targetScrollTop, behavior: 'smooth' });
              }
            }
          });
        },
        troubleshootHistory: [
          { id: 'H1001', time: '2026-08-04 10:15', prompt: '示例：今天 10:00，Digiplus 马尼拉办公室 Maria 及多名员工反馈飞书打开文档与上传附件很慢，Office 365 打开文件也很慢', dateShortcut: '今天', domain: '客户端隧道与平台限流', status: '已定位', summary: '客户端到POP隧道质量下降与SASE平台租户10Gbps限流 (马尼拉出口 203.177.12.8 下 34 人受影响)' },
          { id: 'H1002', time: '2026-06-04 14:22', prompt: '示例：今天 14:20，研发中心 VIP 用户张伟 (zhangwei) 反馈在访问 Harbor 镜像仓库拉取基础镜像时，出现频繁连接超时与 4.2% 的丢包卡顿现象', dateShortcut: '今天', domain: '跨境/POP选路瓶颈', status: '已定位', summary: 'SD-WAN 跨境专线出口瓶颈 (Node-SH-02 丢包率 14.2%, 延迟 >180ms)' },
          { id: 'H1003', time: '2026-06-04 11:15', prompt: '示例：2026-06-04 10:30，上海分公司与苏州研发办多名员工均反馈访问内网 GitLab 提交代码与销售 CRM 构建迟钝', dateShortcut: '今天', domain: '分支连接器丢包', status: '已定位', summary: 'POP-连接器隧道丢包 (上海连接器 01 CPU 89%, 丢包率 8.6%)' },
          { id: 'H1004', time: '2026-06-02 09:30', prompt: '北京总部 财务部多人反馈 CRM 系统页面加载缓慢且数据报表导出失败', dateShortcut: '近7天', domain: '应用后端性能', status: '已定位', summary: 'CRM 后端数据库慢查询与 API 响应延迟 (HTTP 504 概率 12%)' }
        ],

        init() {
          if (window.initDemBranchData) this.branches = window.initDemBranchData();
          if (window.initDemUserData) this.users = window.initDemUserData();
          if (window.initDemAppData) this.apps = window.initDemAppData();

          // 初始化用户视角分析数据
          this.adaptUserDetailByCase(this._troubleshootInput || this.defaultTroubleshootText);

          // 自动监听滚动同步高亮锚点 (Scroll-Spy)
          this.$nextTick(() => {
            const scrollContainer = document.querySelector('.overflow-y-auto') || window;
            const ids = ['impact-user', 'impact-app', 'impact-group', 'impact-event', 'loc-link', 'loc-diag', 'loc-suggest'];
            scrollContainer.addEventListener('scroll', () => {
              if (!this.showDetailedReport) return;
              for (const id of ids) {
                const el = document.getElementById(`sec-${id}`);
                if (el) {
                  const rect = el.getBoundingClientRect();
                  if (rect.top <= 240 && rect.bottom >= 60) {
                    this.activeAnchor = id;
                    break;
                  }
                }
              }
            }, { passive: true });
          });

          const incomingTitle = sessionStorage.getItem('dem_troubleshoot_title');
          if (incomingTitle) {
            sessionStorage.removeItem('dem_troubleshoot_title');
            this._troubleshootInput = `今天 14:20，上海分公司多名员工反馈访问应用发生异常（分析预警告警项：${incomingTitle}）`;
            this.agentWarningMessage = '';
            this.$nextTick(() => this.startTroubleshootAnalysis());
          } else {
            this._troubleshootInput = null;
          }
        },

        get troubleshootInput() { return this._troubleshootInput !== null && this._troubleshootInput !== undefined ? this._troubleshootInput : this.defaultTroubleshootText; },
        set troubleshootInput(v) { this._troubleshootInput = v; },

        onTroubleshootFocus() {
          if (!this._troubleshootInput || this._troubleshootInput.startsWith('1.')) this._troubleshootInput = '';
          this.agentWarningMessage = '';
        },
        onTroubleshootBlur() {
          if (!this._troubleshootInput || !this._troubleshootInput.trim()) this._troubleshootInput = null;
        },

        // ── 分支过滤 ──
        get filteredBranches() {
          const expOrder = { '差': 1, '一般': 2, '正常': 3 };
          return (this.branches || []).filter(b => {
            const q = this.branchSearch.trim().toLowerCase();
            const matchSearch = !q || b.branchName.toLowerCase().includes(q) || b.city.toLowerCase().includes(q) || b.egressIp.includes(q);
            const matchRegion = this.branchRegion === 'all' || (b.region && b.region.includes(this.branchRegion.replace('区', '')));
            const matchExp = this.branchExp === 'all' || b.experience === this.branchExp;
            return matchSearch && matchRegion && matchExp;
          }).sort((a, b) => (expOrder[a.experience] || 9) - (expOrder[b.experience] || 9));
        },
        get paginatedBranches() { const s = (this.branchPage - 1) * this.branchPageSize; return this.filteredBranches.slice(s, s + this.branchPageSize); },

        get filteredUsers() {
          const expOrder = { '差': 1, '一般': 2, '正常': 3 };
          return (this.users || []).filter(u => {
            const q = this.userSearch.trim().toLowerCase();
            return (!q || u.userName.toLowerCase().includes(q) || u.department.toLowerCase().includes(q) || u.ipLocation.includes(q))
              && (this.userExp === 'all' || u.experience === this.userExp);
          }).sort((a, b) => (expOrder[a.experience] || 9) - (expOrder[b.experience] || 9));
        },
        get paginatedUsers() { const s = (this.userPage - 1) * this.userPageSize; return this.filteredUsers.slice(s, s + this.userPageSize); },

        get filteredApps() {
          const expOrder = { '差': 1, '一般': 2, '正常': 3 };
          return (this.apps || []).filter(a => {
            const q = this.appSearch.trim().toLowerCase();
            return (!q || a.appName.toLowerCase().includes(q))
              && (this.appType === 'all' || a.appType === this.appType)
              && (this.appExp === 'all' || a.experience === this.appExp);
          }).sort((a, b) => (expOrder[a.experience] || 9) - (expOrder[b.experience] || 9));
        },
        get paginatedApps() { const s = (this.appPage - 1) * this.appPageSize; return this.filteredApps.slice(s, s + this.appPageSize); },

        get filteredHistory() {
          const q = this.historySearchQuery.trim().toLowerCase();
          if (!q) return this.troubleshootHistory;
          return this.troubleshootHistory.filter(h => h.prompt.toLowerCase().includes(q) || h.domain.toLowerCase().includes(q) || h.summary.toLowerCase().includes(q));
        },

        // ── 工具函数 ──
        formatCityName(popStr) {
          if (!popStr) return '-';
          const cities = ['西安','武汉','广州','重庆','杭州','深圳','上海','北京','南京','成都','天津'];
          return cities.find(c => popStr.includes(c)) || popStr;
        },
        formatIpLocation(ipLoc) {

          this._troubleshootInput = `今天 10:00，Digiplus 马尼拉办公室 Maria 及多名员工反馈访问${type}【${name}】出现严重卡顿与超时异常`;
          this.agentWarningMessage = '';
          this.startTroubleshootAnalysis();
        },

        navigateToUserDetail(user) {
          if (user) { try { sessionStorage.setItem('dem_selected_user', JSON.stringify(user)); } catch(e) {} }
          window.location.href = './DEM-用户详情.html';
        }
      };
    };
  </script>

</body>
</html>
